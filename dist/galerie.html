<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die drei Reiche — Galerie</title>
<style>
  :root {
    --bg: #12140f;
    --panel: #1a1e15;
    --line: #2c3327;
    --text: #d8dcd0;
    --dim: #7d8575;
    --accent: #d8b06a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  }
  #kopf {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 5;
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
    background: #021722; border-bottom: 1px solid var(--line);
  }
  #kopf h1 { margin: 0 14px 0 0; font-size: 15px; color: var(--accent); font-weight: 600; }
  #kopf button {
    font: inherit; color: var(--text); background: #20261a; border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 11px; cursor: pointer;
  }
  #kopf button.an { border-color: var(--accent); color: #fff; }
  #hinweis { margin-left: auto; color: var(--dim); font-size: 12px; }
  #leinwand { position: fixed; top: 52px; left: 0; width: 100%; height: calc(100% - 52px); display: block; }
  #schilder { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .schild {
    position: absolute; padding: 3px 8px; font-size: 12px; color: #fff;
    background: rgba(2, 23, 34, .78); border-radius: 0 0 6px 0;
  }
  #icons {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0; overflow: auto; padding: 18px;
    display: none; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start;
  }
  .ic { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px; text-align: center; }
  .ic .reihe { display: flex; align-items: end; justify-content: center; gap: 10px; height: 72px; }
  .ic .reihe span { display: inline-block; }
  .ic .reihe svg { width: 100%; height: 100%; }
  .ic b { display: block; margin-top: 6px; font-weight: 500; font-size: 12px; }
  #nogl { position: fixed; inset: 52px 0 0 0; display: none; align-items: center; justify-content: center; color: var(--dim); }
</style>
</head>
<body>
<div id="kopf">
  <h1>Galerie</h1>
  <button data-ansicht="waldgott" class="an">Waldgott-Varianten</button>
  <button data-ansicht="einheiten">Einheiten</button>
  <button data-ansicht="gebaeude">Gebäude</button>
  <button data-ansicht="karte">Karte und Effekte</button>
  <button data-ansicht="icons">Icons</button>
  <span id="hinweis">Welche Variante gefällt dir am besten? Nenne ihren Buchstaben.</span>
</div>
<canvas id="leinwand"></canvas>
<div id="schilder"></div>
<div id="icons"></div>

const RULES = {
  // Mindestfluss fuer Werk (Fabriken), in Promille der Versorgung einer
  // Domaene. Werk faellt weiter zuerst -- aber nie ganz auf null, solange
  // ueberhaupt Gegenwart fliesst. Eingefuehrt fuer Baustellen, die frueher
  // Gegenwart brauchten; seit 0.16 bauen nur Erbauer, und Baustellen ziehen
  // keine Gegenwart mehr.
  werkFloor: 125,

  // Schaden in fremder Domaene, in Promille. 1000 = kein Malus.
  // Offene Designfrage aus docs/konzept.md: Macht ein Malus die Grenze zum
  // eigentlichen Schlachtfeld? Messung in docs/scope.md.
  fremdMalus: 1000,

  // Gegenwart, die jeder fertige Anker spendet, pro 100 m Radius.
  // konzept.md nennt "Schreine und Anker" als Herkunft der Gegenwart; bisher
  // spendeten nur die Hauptgebaeude. Damit haengt die Wirtschaft an der
  // einen Regel: ein grosser Kreis traegt mehr als ein kleiner. 0 = aus.
  ankerKraft: 0,

  // Jeder Spieler beginnt mit seinem Kommandanten (UNITS mit commander).
  // Aus nur fuer Vergleichsmessungen.
  kommandanten: true,

  // Erfahrung: Wer lange lebt, wird ein wenig staerker -- teilt mehr Schaden
  // aus und nimmt weniger. Promille je voller Minute seit Entstehung (Einheit)
  // bzw. Bauende (Gebaeude), gedeckelt. Bewusst klein. 0 = aus.
  erfahrungProMin: 10,
  erfahrungMax: 100,

  // Reparatur: Erbauer mit Auftrag direkt neben einem beschaedigten fertigen
  // Gebaeude geben ihm Leben zurueck -- reparaturProTick LP je Tick bei voller
  // Baukraft. Je reparaturLpJeFron LP kostet es 1 Fron; ohne Fron keine
  // Reparatur.
  reparaturProTick: 3,
  reparaturLpJeFron: 20,

  // Skillbaum (SKILLS): Punkte kommen mit der Zeit -- skillStart zu Beginn,
  // dann einer je skillTakt Ticks. Forschungsgebaeude (forschung, Promille)
  // beschleunigen den Takt. Aus = alles frei, keine Verbesserungen; nur fuer
  // Vergleichsmessungen.
  skills: true,
  skillStart: 1,
  skillTakt: 1200,
};

// ------------------------------------------------------------- Karte
// Punktsymmetrisch um die Kartenmitte -- beide Sitzplaetze spielen dieselbe
// Karte. hindernisse: Felsen und Seen als Kreise, unpassierbar und nicht
// bebaubar. adern: Fron- und Goetterblut-Vorkommen. Nur ganze Zahlen.
//
// Vor jeder Basis ein Felsgrat mit einem Tor zur Mitte und zwei Seitenpfaden;
// dahinter zwei Fron-Vorkommen zum Ausbauen. In der Mitte ein Felsring um die
// grosse Goetterblut-Ader, mit vier Zugaengen; zwei Seen; zwei weitere
// Goetterblut-Adern an den Seitenraendern.
const gespiegelt = (o) => ({ ...o, x: MAP - o.x, y: MAP - o.y });
const paarweise = (liste) => liste.flatMap((o) => [o, gespiegelt(o)]);

/** Felsgrat: n Felsen gleichmaessig von (x0,y0) nach (x1,y1), ohne die Luecken. */
function grat(x0, y0, x1, y1, n, r, luecken) {
  const out = [];
  for (let k = 0; k < n; k++) {
    if (luecken.includes(k)) continue;
    out.push({ x: x0 + (((x1 - x0) * k) / (n - 1)) | 0, y: y0 + (((y1 - y0) * k) / (n - 1)) | 0, r, art: 'fels' });
  }
  return out;
}

  hindernisse: [

    ...paarweise(grat(700, 12300, 12300, 700, 21, 560, [2, 3, 9, 10, 11, 17, 18])),
    // Felsring um die Mitte, Zugaenge diagonal
    { x: 11300, y: 10000, r: 500, art: 'fels' },
    { x: 8700, y: 10000, r: 500, art: 'fels' },

// Renderer der 3D-Ansicht: Mathematik, Geometrie aus Grundkoerpern, Shader, Instanzen.
// Gehoert zur Grafik (siehe GEMINI.md). Wird von tools/bundle.mjs mit den
// anderen Dateien zu einem Skript zusammengefuegt -- Bezeichner aus frueheren
// Dateien (gl, MAP, KARTE, ...) sind dort global. Exporte gibt es nur fuer die
// Tests unter Node.
const DM = 0.1; // Dezimeter -> Meter
const HEX = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
// Farbe von Ferne und Hintergrund (Dunst)
const NEBEL = [0.07, 0.08, 0.06];

// ------------------------------------------------------------ Mathematik
// Matrizen spaltenweise wie in WebGL: Element (Zeile r, Spalte c) an [c*4 + r].
function m4mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
  }
  return o;
}
function m4persp(fovy, asp, n, f) {
  const t = 1 / Math.tan(fovy / 2);
  const nf = 1 / (n - f);
  return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0]);
}
function m4look(eye, at, up) {
  let zx = eye[0] - at[0];
  let zy = eye[1] - at[1];
  let zz = eye[2] - at[2];
  let l = Math.hypot(zx, zy, zz);
  zx /= l;
  zy /= l;
  zz /= l;
  let xx = up[1] * zz - up[2] * zy;
  let xy = up[2] * zx - up[0] * zz;
  let xz = up[0] * zy - up[1] * zx;
  l = Math.hypot(xx, xy, xz);
  xx /= l;
  xy /= l;
  xz /= l;
  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;
  return new Float32Array([
    xx, yx, zx, 0,
    xy, yy, zy, 0,
    xz, yz, zz, 0,
    -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
    -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
    -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
    1,
  ]);
}
function m4inv(m) {
  const [a00, a01, a02, a03, a10, a11, a12, a13, a20, a21, a22, a23, a30, a31, a32, a33] = m;
  const b00 = a00 * a11 - a01 * a10;
  const b01 = a00 * a12 - a02 * a10;
  const b02 = a00 * a13 - a03 * a10;
  const b03 = a01 * a12 - a02 * a11;
  const b04 = a01 * a13 - a03 * a11;
  const b05 = a02 * a13 - a03 * a12;
  const b06 = a20 * a31 - a21 * a30;
  const b07 = a20 * a32 - a22 * a30;
  const b08 = a20 * a33 - a23 * a30;
  const b09 = a21 * a32 - a22 * a31;
  const b10 = a21 * a33 - a23 * a31;
  const b11 = a22 * a33 - a23 * a32;
  const det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
  const d = 1 / det;
  return new Float32Array([
    (a11 * b11 - a12 * b10 + a13 * b09) * d,
    (a02 * b10 - a01 * b11 - a03 * b09) * d,
    (a31 * b05 - a32 * b04 + a33 * b03) * d,
    (a22 * b04 - a21 * b05 - a23 * b03) * d,
    (a12 * b08 - a10 * b11 - a13 * b07) * d,
    (a00 * b11 - a02 * b08 + a03 * b07) * d,
    (a32 * b02 - a30 * b05 - a33 * b01) * d,
    (a20 * b05 - a22 * b02 + a23 * b01) * d,
    (a10 * b10 - a11 * b08 + a13 * b06) * d,
    (a01 * b08 - a00 * b10 - a03 * b06) * d,
    (a30 * b04 - a31 * b02 + a33 * b00) * d,
    (a21 * b02 - a20 * b04 - a23 * b00) * d,
    (a11 * b07 - a10 * b09 - a12 * b06) * d,
    (a00 * b09 - a01 * b07 + a02 * b06) * d,
    (a31 * b01 - a30 * b03 - a32 * b00) * d,
    (a20 * b03 - a21 * b01 + a22 * b00) * d,
  ]);
}

// ------------------------------------------------------------ Geometrie
// Grundkoerper als Dreieckslisten [x,y,z, x,y,z, x,y,z, ...], um den
// Ursprung zentriert. Normalen entstehen spaeter je Dreieck (flach).
function geoQuader(w, h, d) {
  const x = w / 2;
  const y = h / 2;
  const z = d / 2;
  const P = [
    [-x, -y, -z], [x, -y, -z], [x, y, -z], [-x, y, -z],
    [-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z],
  ];
  const F = [[0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7], [1, 5, 6, 2], [3, 2, 6, 7], [4, 5, 1, 0]];
  const t = [];
  for (const [a, b, c, e] of F) t.push(...P[a], ...P[b], ...P[c], ...P[a], ...P[c], ...P[e]);
  return t;
}
function geoZylinder(rOben, rUnten, h, seg) {
  const t = [];
  const y0 = -h / 2;
  const y1 = h / 2;
  for (let i = 0; i < seg; i++) {
    const a0 = (i / seg) * Math.PI * 2;
    const a1 = ((i + 1) / seg) * Math.PI * 2;
    const c0 = Math.cos(a0);
    const s0 = Math.sin(a0);
    const c1 = Math.cos(a1);
    const s1 = Math.sin(a1);
    const u0 = [c0 * rUnten, y0, s0 * rUnten];
    const u1 = [c1 * rUnten, y0, s1 * rUnten];
    const o0 = [c0 * rOben, y1, s0 * rOben];
    const o1 = [c1 * rOben, y1, s1 * rOben];
    if (rUnten > 0 || rOben > 0) t.push(...u0, ...u1, ...o1);
    if (rOben > 0) t.push(...u0, ...o1, ...o0);
    if (rOben > 0) t.push(0, y1, 0, ...o0, ...o1);
    if (rUnten > 0) t.push(0, y0, 0, ...u1, ...u0);
  }
  return t;
}
function geoKugel(r, seg) {
  const t = [];
  const ringe = Math.max(3, seg >> 1);
  const p = (i, j) => {
    const th = (i / ringe) * Math.PI;
    const ph = (j / seg) * Math.PI * 2;
    return [r * Math.sin(th) * Math.cos(ph), r * Math.cos(th), r * Math.sin(th) * Math.sin(ph)];
  };
  for (let i = 0; i < ringe; i++) {
    for (let j = 0; j < seg; j++) {
      const a = p(i, j);
      const b = p(i + 1, j);
      const c = p(i + 1, j + 1);
      const d = p(i, j + 1);
      if (i > 0) t.push(...a, ...b, ...d);
      if (i < ringe - 1) t.push(...d, ...b, ...c);
    }
  }
  return t;
}
function geoScheibe(r, seg) {
  const t = [];
  for (let i = 0; i < seg; i++) {
    const a0 = (i / seg) * Math.PI * 2;
    const a1 = ((i + 1) / seg) * Math.PI * 2;
    t.push(0, 0, 0, Math.cos(a1) * r, 0, Math.sin(a1) * r, Math.cos(a0) * r, 0, Math.sin(a0) * r);
  }
  return t;
}

/**
 * Ein Modell aus Teilen. Jedes Teil: [form, masse, position, farbe, team,
 * drehung]. form: 'q' Quader [w,h,d], 'z' Zylinder [rOben,rUnten,h,seg],
 * 'k' Kugel [r,seg], 's' Scheibe [r,seg]. team: Anteil der Fraktionsfarbe.
 * drehung: [rx, ry, rz] in Bogenmass, um die Teilmitte.
 * Ergebnis je Ecke: x,y,z, nx,ny,nz, r,g,b, team.
 */
function baueModell(teile) {
  const v = [];
  for (const [form, masse, pos, farbe, team = 0, dreh = [0, 0, 0]] of teile) {
    const roh =
      form === 'q' ? geoQuader(...masse) : form === 'z' ? geoZylinder(...masse) : form === 'k' ? geoKugel(...masse) : geoScheibe(...masse);
    const [rx, ry, rz] = dreh;
    const cx = Math.cos(rx);
    const sx = Math.sin(rx);
    const cy = Math.cos(ry);
    const sy = Math.sin(ry);
    const cz = Math.cos(rz);
    const sz = Math.sin(rz);
    const tf = (x, y, z) => {
      // erst um x, dann um z, dann um y
      let y1 = y * cx - z * sx;
      let z1 = y * sx + z * cx;
      let x2 = x * cz - y1 * sz;
      let y2 = x * sz + y1 * cz;
      let x3 = x2 * cy + z1 * sy;
      let z3 = -x2 * sy + z1 * cy;
      return [x3 + pos[0], y2 + pos[1], z3 + pos[2]];
    };
    const [r, g, b] = HEX(farbe);
    for (let i = 0; i < roh.length; i += 9) {
      const A = tf(roh[i], roh[i + 1], roh[i + 2]);
      const B = tf(roh[i + 3], roh[i + 4], roh[i + 5]);
      const C = tf(roh[i + 6], roh[i + 7], roh[i + 8]);
      let nx = (B[1] - A[1]) * (C[2] - A[2]) - (B[2] - A[2]) * (C[1] - A[1]);
      let ny = (B[2] - A[2]) * (C[0] - A[0]) - (B[0] - A[0]) * (C[2] - A[2]);
      let nz = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
      const l = Math.hypot(nx, ny, nz) || 1;
      nx /= l;
      ny /= l;
      nz /= l;
      // Normale nach aussen drehen: weg von der Teilmitte. Flache Scheiben nach oben.
      const mx = (A[0] + B[0] + C[0]) / 3 - pos[0];
      const my = (A[1] + B[1] + C[1]) / 3 - pos[1];
      const mz = (A[2] + B[2] + C[2]) / 3 - pos[2];
      const aussen = form === 's' ? ny : nx * mx + ny * my + nz * mz;
      if (aussen < 0) {
        nx = -nx;
        ny = -ny;
        nz = -nz;
      }
      for (const P of [A, B, C]) v.push(P[0], P[1], P[2], nx, ny, nz, r, g, b, team);
    }
  }
  return new Float32Array(v);
}

// ------------------------------------------------------------ WebGL
const VS = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
layout(location=2) in vec4 aCol;
layout(location=3) in vec4 iA; // x, y, z, Drehung
layout(location=4) in vec4 iB; // Massstab, Hoehenfaktor, Helligkeit, Alpha
layout(location=5) in vec4 iC; // Teamfarbe, w: Schrittphase (-1..1)
uniform mat4 uVP;
uniform vec3 uLicht;
out vec4 vCol;
out float vTiefe;
out vec3 vTeam;
out vec2 vWelt;
void main() {
  vTeam = iC.rgb;
  float c = cos(iA.w), s = sin(iA.w);
  // Schritt & Atembewegung:
  // 1. Saum und Wurzeln schwingen dynamisch mit der Bewegung/Atmung
  vec3 a = aPos;
  float saum = max(0.0, 0.85 - a.y);
  a.z += iC.w * 0.45 * saum;
  a.x += sin(iC.w * 3.14159 + a.y * 3.5) * 0.04 * saum;
  a.y += abs(iC.w) * 0.05 * saum;

  // 2. Organisches Atmen des Brustbereichs (Heben und Weiten von Gewand & Brustkorb)
  float atmen = sin(iC.w * 3.14159265);
  float brust = smoothstep(1.5, 2.7, a.y) * smoothstep(4.2, 2.7, a.y);
  a.x += aNor.x * atmen * 0.025 * brust;
  a.z += aNor.z * atmen * 0.035 * brust;

  // 3. Aufsteigende Glut- und Funkenpartikel schweben lebendig im magischen Auftrieb
  if (aCol.a > 1.5 && a.y > 1.4) {
    a.y += sin(iC.w * 3.14159 + aPos.x * 6.0 + aPos.z * 5.0) * 0.06;
    a.x += cos(iC.w * 2.5 + aPos.y * 4.0) * 0.03;
    a.z += sin(iC.w * 2.0 + aPos.y * 4.0) * 0.03;
  }

  vec3 p = a * vec3(iB.x, iB.x * iB.y, iB.x);
  vec3 r = vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z) + iA.xyz;
  vec3 n = normalize(vec3(c * aNor.x + s * aNor.z, aNor.y / max(iB.y, 0.05), -s * aNor.x + c * aNor.z));

  // Selbstleuchtende Teile behalten ihre eigene Farbe, ohne Fraktionsfarbe.
  float team = aCol.a > 1.5 ? 0.0 : aCol.a;
  vec3 col = mix(aCol.rgb, iC.rgb, team) * iB.z;

  if (aCol.a > 1.5) {
    // Magisch gluehende Elemente (Augen, Kristalle, Glutherz) pulsieren im Atemrhythmus
    float puls = 1.0 + 0.22 * sin(iC.w * 3.14159265);
    vCol = vec4(col * 1.55 * puls, iB.w);
  } else {
    // Hemi-Umgebungslicht (kühler Himmel oben, warmer Erdboden unten)
    vec3 ambient = mix(vec3(0.32, 0.30, 0.25), vec3(0.48, 0.52, 0.56), n.y * 0.5 + 0.5);
    float d = max(dot(n, uLicht), 0.0);
    vec3 sonne = vec3(0.85, 0.82, 0.75) * d;
    // Randlicht (Rim Light) hebt Silhouetten aus Spielhöhe plastisch hervor
    float rim = pow(1.0 - max(dot(n, vec3(0.0, 0.8, 0.6)), 0.0), 2.2) * 0.24;
    vCol = vec4(col * (ambient + sonne) + col * rim, iB.w);
  }

  gl_Position = uVP * vec4(r, 1.0);
  vTiefe = gl_Position.w;
  vWelt = r.xz;
}`;
const FS = `#version 300 es
precision mediump float;
in vec4 vCol;
in float vTiefe;
in vec3 vTeam;
in vec2 vWelt;
uniform vec3 uNebel;
uniform float uRoentgen; // 1: verdeckte Einheit als Umriss in Teamfarbe
uniform sampler2D uSicht; // Nebel des Krieges: 1 sichtbar, 0.47 erkundet, 0 unbekannt
uniform float uKarte; // Kantenlaenge der Karte in Metern
out vec4 o;
void main() {
  if (uRoentgen > 0.5) {
    o = vec4(mix(vTeam, vec3(1.0), 0.3), 0.5);
    return;
  }
  float f = clamp((vTiefe - 700.0) / 1600.0, 0.0, 0.55);
  // Weiche, runde Nebelraender statt blockiger Rasterkanten
  vec2 uv = clamp(vWelt / uKarte, 0.0, 1.0);
  vec2 ts = vec2(textureSize(uSicht, 0));
  vec2 d = 0.55 / max(ts, vec2(1.0));
  float s0 = texture(uSicht, uv).r;
  float s1 = texture(uSicht, uv + vec2(d.x, 0.0)).r;
  float s2 = texture(uSicht, uv - vec2(d.x, 0.0)).r;
  float s3 = texture(uSicht, uv + vec2(0.0, d.y)).r;
  float s4 = texture(uSicht, uv - vec2(0.0, d.y)).r;
  float sicht = (s0 * 2.0 + s1 + s2 + s3 + s4) * (1.0 / 6.0);
  o = vec4(mix(vCol.rgb, uNebel, f) * mix(0.16, 1.0, sicht), vCol.a);
}`;
const VS_LINIE = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec4 aCol;
uniform mat4 uVP;
out vec4 vCol;
void main() { vCol = aCol; gl_Position = uVP * vec4(aPos, 1.0); }`;
const FS_LINIE = `#version 300 es
precision mediump float;
in vec4 vCol;
out vec4 o;
void main() { o = vCol; }`;

function shader(typ, quelle) {
  const s = gl.createShader(typ);
  gl.shaderSource(s, quelle);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function programm(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

let PROG;
let PROG_L;
const MODELLE = {};
let bodenModell;
let linienPuffer;
let linienVao;

/** Laedt ein Modell in die Grafikkarte: Eckpuffer, Instanzpuffer, VAO. */
function ladeModell(daten) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, daten, gl.STATIC_DRAW);
  const st = 10 * 4;
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, st, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, st, 12);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 4, gl.FLOAT, false, st, 24);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  const ist = 12 * 4;
  for (let k = 0; k < 3; k++) {
    gl.enableVertexAttribArray(3 + k);
    gl.vertexAttribPointer(3 + k, 4, gl.FLOAT, false, ist, k * 16);
    gl.vertexAttribDivisor(3 + k, 1);
  }
  gl.bindVertexArray(null);
  return { vao, ib, anzahl: daten.length / 10, inst: [], cap: 0 };
}

function initGL() {
  PROG = programm(VS, FS);
  PROG_L = programm(VS_LINIE, FS_LINIE);
  for (const [k, teile] of Object.entries(MODELLE_DEF)) MODELLE[k] = ladeModell(baueModell(teile));
  bodenModell = typeof baueBoden === 'function' ? baueBoden() : null; // die Galerie hat kein Gelaende
  linienVao = gl.createVertexArray();
  gl.bindVertexArray(linienVao);
  linienPuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, linienPuffer);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 28, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 28, 12);
  gl.bindVertexArray(null);
}

/** Eine Instanz vormerken: Modell, Ort (m), Drehung, Massstab, Hoehe, Helligkeit, Alpha, Teamfarbe. */
function instanz(key, x, y, z, rot, scale, team, yScale = 1, hell = 1, alpha = 1, schritt = 0) {
  const m = MODELLE[key];
  if (!m) return;
  m.inst.push(x, y, z, rot, scale, yScale, hell, alpha, team[0], team[1], team[2], schritt);
}

function zeichneInstanzen(m, behalten = false) {
  const n = m.inst.length / 12;
  if (!n) return;
  gl.bindVertexArray(m.vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, m.ib);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(m.inst), gl.DYNAMIC_DRAW);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, m.anzahl, n);
  if (!behalten) m.inst.length = 0;
}

// Massstab: 1 entspricht dem Radius der Einheit bzw. des Gebaeudes (die

/** Lange Klauenfinger einer Hand, von der Handflaeche aus nach unten. */
function klauen(x, y, z, seite) {
  const t = [];
  for (let i = 0; i < 4; i++) {
    const dx = x + seite * (i - 1.5) * 0.075;
    const laenge = 0.62 - Math.abs(i - 1.5) * 0.08;
    t.push(['q', [0.035, laenge, 0.035], [dx, y - laenge / 2, z + 0.04 * i], GOLD2, GLUEHT, [0.25, 0, seite * (i - 1.5) * 0.06]]);
  }
  // Daumen
  t.push(['q', [0.035, 0.32, 0.035], [x - seite * 0.17, y - 0.08, z + 0.05], GOLD2, GLUEHT, [0.4, 0, -seite * 0.7]]);
  return t;
}

/** Zerfaserter Saum: Spitzen, die nach unten zeigen, rund um den Mantel. */
function saum(r, y, n) {
  const t = [];
  for (let i = 0; i < n; i++) {
    const w = (i / n) * Math.PI * 2;
    const lang = 0.45 + ((i * 37) % 5) * 0.08;
    t.push(['z', [0.16, 0, lang, 4], [Math.cos(w) * r, y - lang / 2, Math.sin(w) * r], i % 2 ? MANTEL : MANTEL2, 0.05]);
  }
  return t;
}

// ------------------------------------------------------------- Bausteine
// Kleine Werkzeuge, damit Modelle aus wenigen, gut lesbaren Formen entstehen
// statt aus Dutzenden handgesetzter Quader.

/** Pseudozufall 0..1 aus Zahl und Salz -- deterministisch, Modelle bleiben stabil. */
function zufall(i, salz = 0) {
  const s = Math.sin(i * 12.9898 + salz * 78.233) * 43758.5453;
  return s - Math.floor(s);
}
const vPlus = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k, p[2] + v[2] * k];
const vEinheit = (v) => {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
};

/**
 * Teil entlang der Strecke a -> b. seg 0: Quader mit Querschnitt dicke (Zahl
 * oder [breite, tiefe]); seg >= 3: Kegel mit Radius dicke bei a und
 * dicke * spitz bei b. Die Drehung folgt aus der Richtung (rx, dann rz).
 */
function stab(a, b, dicke, farbe, team = 0, seg = 0, spitz = 1) {
  const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const l = Math.hypot(d[0], d[1], d[2]) || 1e-6;
  const rx = Math.asin(Math.max(-1, Math.min(1, d[2] / l)));
  const rz = Math.atan2(-d[0], d[1]);
  const mitte = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2];
  if (seg) return ['z', [dicke * spitz, dicke, l, seg], mitte, farbe, team, [rx, 0, rz]];
  const [bq, tq] = Array.isArray(dicke) ? dicke : [dicke, dicke];
  return ['q', [bq, l, tq], mitte, farbe, team, [rx, 0, rz]];
}

/**
 * Geweih einer Seite (seite +1 rechts, -1 links): jede Stange teilt sich in
 * eine steilere Fortsetzung und ein Ende nach aussen. glut: Farbe
 * gluehender Spitzen oder null; knorrig: Unregelmaessigkeit der Aeste.
 */
function geweih(basis, seite, o) {
  const { laenge = 0.55, dicke = 0.05, stufen = 3, spreiz = 0.55, start = 0.75, farbe = '#2b231c', seg = 3, team = 0, glut = null, knorrig = 0 } = o;
  const t = [];
  const ast = (p, w, l, d, s, nr) => {
    const zitter = knorrig * (zufall(nr, 7) - 0.5);
    const q = [p[0] + seite * Math.sin(w + zitter) * l, p[1] + Math.cos(w + zitter) * l, p[2] - l * 0.12 + knorrig * 0.2 * l * (zufall(nr, 9) - 0.5)];
    t.push(stab(p, q, d, farbe, team, seg, 0.6));
    if (s <= 0) {
      if (glut) t.push(['k', [d * 1.3, 4], q, glut, GLUEHT]);
      return;
    }
    ast(q, w - spreiz * 0.55, l * 0.8, d * 0.72, s - 1, nr * 2 + 1);
    ast(q, w + spreiz, l * 0.55, d * 0.6, s - 1, nr * 2 + 2);
  };
  ast(basis, start, laenge, dicke, stufen, 1);
  return t;
}

/**
 * Gluehende Klauenhand. w: Handgelenk, f: Fingerrichtung, s: quer ueber die
 * Hand, b: wohin sich die Spitzen kruemmen. Finger aus zwei Gliedern, die
 * Spitzen laufen spitz zu.
 */
function klauenhand(w, f, s, b, o = {}) {
  const { laenge = 0.6, finger = 4, dicke = 0.042, krumm = 0.25, farbe = GOLD, spitze = GOLD2, glieder = 2, seg = 3, breite = 0.24 } = o;
  f = vEinheit(f);
  s = vEinheit(s);
  const t = [];
  const knoechel = vPlus(w, f, 0.2);
  t.push(stab(w, knoechel, [breite, 0.07], farbe, GLUEHT));
  for (let i = 0; i < finger; i++) {
    const q = i - (finger - 1) / 2;
    const basis = vPlus(knoechel, s, q * (breite / finger));
    const l = laenge * (1 - Math.abs(q) * 0.12);
    if (glieder === 1) {
      t.push(stab(basis, vPlus(vPlus(basis, f, l), s, q * 0.05), dicke, spitze, GLUEHT, seg, 0.1));
      continue;
    }
    const mitte = vPlus(vPlus(basis, f, l * 0.55), s, q * 0.035);
    const ende = vPlus(vPlus(mitte, f, l * 0.45), b, krumm * l);
    t.push(stab(basis, mitte, dicke, farbe, GLUEHT, seg, 0.85));
    t.push(stab(mitte, ende, dicke * 0.85, spitze, GLUEHT, seg, 0.12));
  }
  // Daumen: kurz, schraeg zur anderen Seite
  const daumen = vPlus(vPlus(vPlus(w, f, 0.08), s, -breite * 0.75), f, laenge * 0.35);
  t.push(stab(vPlus(w, s, -breite * 0.35), daumen, dicke, spitze, GLUEHT, seg, 0.2));
  return t;
}

/** Zerfetzter Saum: haengende Stoffstreifen auf einem Kreis um mitte [x, z]. */
function fetzen(r, y, n, laenge, breite, farben, o = {}) {
  const { salz = 1, neig = 0.12, mitte = [0, 0], team = 0.05, glut = null } = o;
  const t = [];
  for (let i = 0; i < n; i++) {
    const w = ((i + zufall(i, salz) * 0.6) / n) * Math.PI * 2;
    const l = laenge * (0.55 + 0.6 * zufall(i, salz + 1));
    const rr = r + (Math.sin(neig) * l) / 2;
    const p = [mitte[0] + Math.cos(w) * rr, y - l / 2, mitte[1] + Math.sin(w) * rr];
    t.push(['q', [breite * (0.7 + 0.5 * zufall(i, salz + 2)), l, 0.04], p, farben[i % farben.length], team, [neig, -w - Math.PI / 2, 0]]);
    // Glimmende Enden an jedem dritten Streifen
    if (glut && i % 3 === 0) {
      const rEnde = r + Math.sin(neig) * l;
      t.push(['k', [0.05, 4], [mitte[0] + Math.cos(w) * rEnde, y - l, mitte[1] + Math.sin(w) * rEnde], glut, GLUEHT]);
    }
  }
  return t;
}

/** Senkrechte Falten auf einem Kegelmantel: dreikantige Leisten von unten nach oben. */
function falten(rU, rO, y0, y1, n, farbe, o = {}) {
  const { salz = 3, dicke = 0.06, team = 0.05, lassen = -1 } = o;
  const t = [];
  for (let i = 0; i < n; i++) {
    if (i === lassen) continue;
    const w = ((i + 0.5 + (zufall(i, salz) - 0.5) * 0.5) / n) * Math.PI * 2 + Math.PI / 2;
    const c = Math.cos(w);
    const s = Math.sin(w);
    const oben = y1 - (y1 - y0) * 0.25 * zufall(i, salz + 1);
    const rOben = rO + ((rU - rO) * (y1 - oben)) / (y1 - y0);
    t.push(stab([c * rU, y0, s * rU], [c * rOben, oben, s * rOben], dicke, farbe, team, 3, 0.3));
  }
  return t;
}

/** Wurzeln, die aus dem Saum in den Boden greifen: zwei Glieder, nach aussen duenner. */
function wurzeln(r, y, n, weite, dicke, farbe, salz = 5) {
  const t = [];
  for (let i = 0; i < n; i++) {
    const w = ((i + zufall(i, salz)) / n) * Math.PI * 2;
    const c = Math.cos(w);
    const s = Math.sin(w);
    const a = [c * r, y, s * r];
    const k = r + weite * (0.45 + 0.2 * zufall(i, salz + 1));
    const m = [c * k + s * 0.08, y * 0.35, s * k - c * 0.08];
    const e = [c * (r + weite * (0.9 + 0.3 * zufall(i, salz + 2))), 0.02, s * (r + weite)];
    t.push(stab(a, m, dicke, farbe, 0.05, 4, 0.7));
    t.push(stab(m, e, dicke * 0.7, farbe, 0.05, 4, 0.15));
  }
  return t;
}

// ------------------------------------------------------------- Waldgott-Varianten
// Jede Variante steht fuer eine Richtung des Grafikstils des ganzen Spiels.
// Gemeinsam (GEMINI.md): fast schwarzer Mantel ohne Fuesse, unten zerfasert,
// hoher Kragen, haengende Aermel, schwarzer Kopf, gelbe Augen, Geweih,
// gekreuzte gluehende Klauenhaende.

const AUGE = '#ffd23a';
const ARM_GLUT = '#c9742c';

/**
 * Zwei gekreuzte Unterarme mit Klauenhaenden vor dem Mantel. rechts/links:
 * [Ellbogen, Handgelenk]; die Finger zeigen schraeg nach unten zur anderen
 * Seite, die Spitzen kruemmen sich zum Betrachter.
 */
function gekreuzteHaende(o) {
  const { rechts, links, laenge = 0.6, hand = {} } = o;
  const t = [];
  for (const [ell, wrist, seite] of [[...rechts, 1], [...links, -1]]) {
    t.push(stab(ell, wrist, 0.075, ARM_GLUT, GLUEHT, 5, 0.85));
    t.push(...klauenhand(wrist, [-seite * 0.42, -1, 0.12], [1, seite * 0.42, 0], [0, 0, 1], { laenge, ...hand }));
  }
  return t;
}

/**
 * G.2 -- Glutherz (High-Res): Vollwertiges 3D-Asset fuer das Spiel.
 * Organischer Faltenwurf ohne polygonale Kloetzchen, fliessende Drapierung
 * mit Reverskanten, tiefgreifende Wurzeln im Boden, ein hochdetaillierter
 * pulsierender Magmakern in einem schuetzenden Obsidian-Brustkorb,
 * artikulierte goldene Klauenhaende und ein 4-fach verzweigtes Hirschgeweih
 * mit glimmenden Spitzen. Vollstaendig mit weichen Zylindern/Kegeln modelliert
 * (unter 6000 Ecken).
 */
function waldgottGlutherz2() {
  const M_AUSSEN = '#100c0a';
  const M_MITTEL = '#16110d';
  const M_FALTE = '#1e1610';
  const OBSIDIAN = '#070505';
  const GLUT_KERN = '#fff8e7';
  const GLUT_HELL = '#ff9800';
  const GLUT_FEUER = '#e64a19';
  const GLUT_DUNKEL = '#bf360c';

  const GOLD_KLAUE = '#ffd54f';
  const GOLD_SPITZE = '#fff3c4';
  const GEWEIH_HOLZ = '#211812';
  const GEWEIH_GLUT = '#ffa726';
  const AUGE_AUSSEN = '#ffb300';
  const AUGE_KERN = '#ffffff';

  const t = [];

  // 1. Mantel-Volumen: 3 glatte Kegelsegmente (12 Segmente fuer weiche Rundungen)
  t.push(
    ['z', [0.46, 0.64, 1.1, 12], [0, 3.25, -0.05], M_AUSSEN, 0.05],
    ['z', [0.64, 0.88, 1.3, 12], [0, 2.1, -0.06], M_MITTEL, 0.05],
    ['z', [0.88, 1.14, 1.1, 12], [0, 0.95, -0.07], M_AUSSEN, 0.05]
  );

  // Drapierte Kaskadenfalten entlang des Mantels
  const anzahlFalten = 6;
  for (let i = 0; i < anzahlFalten; i++) {
    const phi = 0.68 + (i / (anzahlFalten - 1)) * (Math.PI * 2 - 1.36);
    const cosP = Math.cos(phi);
    const sinP = Math.sin(phi);
    const pO = [cosP * 0.52, 3.4, sinP * 0.52 - 0.05];
    const pM = [cosP * 0.74, 2.1, sinP * 0.74 - 0.06];
    const pU = [cosP * 1.02, 0.7, sinP * 1.02 - 0.07];
    t.push(stab(pO, pM, 0.07, M_FALTE, 0.06, 3, 0.9));
    t.push(stab(pM, pU, 0.065, M_FALTE, 0.06, 3, 1.15));
  }
  // Gewoelbte Reverskanten links und rechts der Brustöffnung
  for (const seite of [1, -1]) {
    const kO = [seite * 0.38, 3.65, 0.22];
    const kM = [seite * 0.44, 2.5, 0.48];
    const kU = [seite * 0.56, 1.35, 0.72];
    const kEnd = [seite * 0.75, 0.4, 0.88];
    t.push(stab(kO, kM, 0.08, M_FALTE, 0.06, 3, 1.1));
    t.push(stab(kM, kU, 0.09, M_FALTE, 0.06, 3, 1.1));
    t.push(stab(kU, kEnd, 0.085, M_FALTE, 0.06, 3, 0.9));
  }

  // Kraeftige Wurzeln am Saum, die organisch in den Boden greifen
  const anzahlWurzeln = 5;
  for (let i = 0; i < anzahlWurzeln; i++) {
    const phi = (i / anzahlWurzeln) * Math.PI * 2 + zufall(i, 11) * 0.35;
    const cosP = Math.cos(phi);
    const sinP = Math.sin(phi);
    const rStart = 1.08;
    const p0 = [cosP * rStart, 0.45, sinP * rStart - 0.05];
    const p1 = [cosP * (rStart + 0.28) + sinP * 0.08, 0.18, sinP * (rStart + 0.28) - 0.05];
    const p2 = [cosP * (rStart + 0.58), 0.02, sinP * (rStart + 0.58) - 0.05];
    t.push(stab(p0, p1, 0.075, '#18120e', 0.04, 3, 0.75));
    t.push(stab(p1, p2, 0.056, '#18120e', 0.04, 3, 0.2));
  }
  // Glimmende Saumfetzen
  for (let i = 0; i < 6; i++) {
    const phi = (i / 6) * Math.PI * 2 + 0.3;
    const cosP = Math.cos(phi);
    const sinP = Math.sin(phi);
    const p0 = [cosP * 1.08, 0.55, sinP * 1.08 - 0.06];
    const l = 0.42 + zufall(i, 20) * 0.25;
    const p1 = [cosP * (1.12 + l * 0.15), 0.55 - l, sinP * (1.12 + l * 0.15) - 0.06];
    t.push(stab(p0, p1, 0.05, i % 2 ? M_AUSSEN : M_MITTEL, 0.05, 3, 0.1));
    if (i % 2 === 0) {
      t.push(['q', [0.05, 0.05, 0.05], p1, GLUT_HELL, GLUEHT]);
    }
  }

  // 2. Das Glutherz: Aufsteigende Lavasäule, Kern und Obsidian-Brustkorb
  t.push(
    ['z', [0.18, 0.34, 1.7, 6], [0, 1.45, 0.1], GLUT_DUNKEL, GLUEHT],
    ['z', [0.12, 0.22, 1.4, 5], [0, 1.6, 0.16], GLUT_FEUER, GLUEHT],
    ['k', [0.24, 6], [0, 2.65, 0.18], GLUT_KERN, GLUEHT],
    ['k', [0.34, 6], [0, 2.65, 0.18], GLUT_HELL, GLUEHT],
    ['k', [0.42, 6], [0, 2.65, 0.18], GLUT_FEUER, GLUEHT]
  );
  // Gebogene Rippenbögen um den glühenden Kern
  const rippenHoehen = [2.95, 2.6, 2.25];
  for (let r = 0; r < rippenHoehen.length; r++) {
    const yR = rippenHoehen[r];
    const weite = 0.38 + (r === 1 ? 0.05 : 0);
    for (const s of [1, -1]) {
      const pBack = [s * 0.24, yR, -0.05];
      const pMid = [s * weite, yR - 0.04, 0.28];
      const pFront = [s * 0.12, yR - 0.08, 0.48];
      t.push(stab(pBack, pMid, 0.048, OBSIDIAN, 0.02, 3, 0.9));
      t.push(stab(pMid, pFront, 0.042, OBSIDIAN, 0.02, 3, 0.6));
    }
  }
  // Aufsteigende Glut- und Funkenpartikel
  for (let i = 0; i < 9; i++) {
    const w = zufall(i, 40) * Math.PI * 2;
    const dist = 0.2 + zufall(i, 41) * 0.65;
    const yH = 1.6 + zufall(i, 42) * 3.2;
    const col = i % 3 === 0 ? GLUT_KERN : (i % 2 === 0 ? GLUT_HELL : GLUT_FEUER);
    t.push(['q', [0.048, 0.048, 0.048], [Math.cos(w) * dist, yH, Math.sin(w) * dist + 0.25], col, GLUEHT, [0.4, w, 0.4]]);
  }

  // 3. Weite Glockenärmel und artikulierte goldene Klauen
  for (const s of [1, -1]) {
    t.push(['k', [0.28, 5], [s * 0.68, 3.55, 0.02], M_AUSSEN, 0.05]);
    t.push(stab([s * 0.68, 3.55, 0.02], [s * 0.92, 2.3, 0.12], 0.21, M_MITTEL, 0.05, 4, 1.45));
    t.push(stab([s * 0.92, 2.3, 0.12], [s * 0.96, 1.4, 0.16], 0.26, M_AUSSEN, 0.05, 4, 0.7));
  }
  const armRechts = {
    ell: [0.85, 2.45, 0.32],
    wrist: [0.22, 2.22, 0.78],
    dirF: [-0.62, -0.65, 0.44],
    dirS: [0.55, -0.7, 0],
    dirB: [0.2, 0.3, 0.9]
  };
  const armLinks = {
    ell: [-0.85, 2.15, 0.32],
    wrist: [-0.18, 1.88, 0.82],
    dirF: [0.62, -0.65, 0.44],
    dirS: [-0.55, -0.7, 0],
    dirB: [0.2, 0.3, 0.9]
  };
  for (const arm of [armRechts, armLinks]) {
    t.push(stab(arm.ell, arm.wrist, 0.072, GOLD_ARM, GLUEHT, 4, 0.85));
    t.push(['z', [0.082, 0.082, 0.06, 4], arm.wrist, GOLD_KLAUE, GLUEHT]);
    const handMitte = vPlus(arm.wrist, vEinheit(arm.dirF), 0.14);
    t.push(stab(arm.wrist, handMitte, [0.18, 0.06], GOLD_ARM, GLUEHT));
    const uF = vEinheit(arm.dirF);
    const uS = vEinheit(arm.dirS);
    const uB = vEinheit(arm.dirB);
    for (let f = 0; f < 4; f++) {
      const q = f - 1.5;
      const basis = vPlus(handMitte, uS, q * 0.05);
      const l = 0.58 * (1 - Math.abs(q) * 0.1);
      const gelenk = vPlus(vPlus(basis, uF, l * 0.52), uS, q * 0.025);
      const spitze = vPlus(vPlus(gelenk, uF, l * 0.48), uB, 0.22);
      t.push(stab(basis, gelenk, 0.038, GOLD_KLAUE, GLUEHT, 3, 0.8));
      t.push(stab(gelenk, spitze, 0.030, GOLD_SPITZE, GLUEHT, 3, 0.12));
    }
    const dBasis = vPlus(handMitte, uS, -0.11);
    const dGelenk = vPlus(vPlus(dBasis, uF, 0.12), uS, -0.09);
    const dSpitze = vPlus(vPlus(dGelenk, uF, 0.18), uB, 0.12);
    t.push(stab(dBasis, dGelenk, 0.036, GOLD_KLAUE, GLUEHT, 3, 0.8));
    t.push(stab(dGelenk, dSpitze, 0.028, GOLD_SPITZE, GLUEHT, 3, 0.15));
  }

  // 4. Gefluegelter Kragen, Kapuzenschleier und gluehende Augen
  for (const s of [1, -1]) {
    const c0 = [s * 0.34, 3.8, 0.0];
    const c1 = [s * 0.42, 4.4, -0.12];
    const c2 = [s * 0.38, 4.88, -0.22];
    t.push(stab(c0, c1, [0.38, 0.06], M_AUSSEN, 0.05));
    t.push(stab(c1, c2, [0.26, 0.05], M_FALTE, 0.05));
  }
  t.push(
    ['q', [0.55, 0.85, 0.08], [0, 4.3, -0.32], M_AUSSEN, 0.05, [-0.18, 0, 0]],
    ['q', [0.42, 0.55, 0.07], [0, 4.85, -0.42], M_FALTE, 0.05, [-0.25, 0, 0]],
    ['k', [0.32, 6], [0, 4.34, 0.04], OBSIDIAN, 0.02],
    ['z', [0.30, 0.18, 0.35, 5], [0, 4.45, 0.12], OBSIDIAN, 0.02, [0.45, 0, 0]],
    ['k', [0.22, 6], [0, 4.22, 0.1], '#040303'],
    ['z', [0.15, 0.05, 0.28, 5], [0, 4.02, 0.14], '#040303']
  );
  for (const s of [1, -1]) {
    const eyePos = [s * 0.09, 4.24, 0.29];
    t.push(['k', [0.052, 4], eyePos, AUGE_AUSSEN, GLUEHT]);
    t.push(['k', [0.028, 4], [eyePos[0], eyePos[1], eyePos[2] + 0.02], AUGE_KERN, GLUEHT]);
    t.push(stab(eyePos, [eyePos[0] * 0.9, eyePos[1] - 0.16, eyePos[2] - 0.01], 0.018, GLUT_HELL, GLUEHT, 3, 0.1));
  }

  // 5. Majestaetisches Hirschgeweih mit glimmenden Spitzen
  function baueAst(basis, seite) {
    const bT = [];
    const p0 = basis;
    const p1 = [basis[0] + seite * 0.18, basis[1] + 0.35, basis[2] - 0.08];
    bT.push(stab(p0, p1, 0.062, GEWEIH_HOLZ, 0, 3, 0.85));
    const pAug = [p1[0] + seite * 0.08, p1[1] + 0.16, p1[2] + 0.26];
    bT.push(stab(p1, pAug, 0.042, GEWEIH_HOLZ, 0, 3, 0.2));
    bT.push(['q', [0.048, 0.048, 0.048], pAug, GEWEIH_GLUT, GLUEHT, [0.5, 0.5, 0]]);
    const p2 = [p1[0] + seite * 0.26, p1[1] + 0.38, p1[2] - 0.1];
    bT.push(stab(p1, p2, 0.052, GEWEIH_HOLZ, 0, 3, 0.85));
    const pEis = [p2[0] + seite * 0.32, p2[1] + 0.24, p2[2] + 0.05];
    bT.push(stab(p2, pEis, 0.038, GEWEIH_HOLZ, 0, 3, 0.2));
    bT.push(['q', [0.045, 0.045, 0.045], pEis, GEWEIH_GLUT, GLUEHT, [0.5, 0.5, 0]]);
    const pKroneBasis = [p2[0] + seite * 0.16, p2[1] + 0.42, p2[2] - 0.05];
    bT.push(stab(p2, pKroneBasis, 0.044, GEWEIH_HOLZ, 0, 3, 0.85));
    const spitzen = [
      [pKroneBasis[0] + seite * 0.05, pKroneBasis[1] + 0.32, pKroneBasis[2] + 0.1],
      [pKroneBasis[0] + seite * 0.22, pKroneBasis[1] + 0.38, pKroneBasis[2] - 0.05],
      [pKroneBasis[0] - seite * 0.12, pKroneBasis[1] + 0.28, pKroneBasis[2] - 0.15]
    ];
    for (const sp of spitzen) {
      bT.push(stab(pKroneBasis, sp, 0.034, GEWEIH_HOLZ, 0, 3, 0.15));
      bT.push(['q', [0.042, 0.042, 0.042], sp, GEWEIH_GLUT, GLUEHT, [0.5, 0.5, 0]]);
    }
    return bT;
  }
  t.push(...baueAst([0.13, 4.45, 0.02], 1));
  t.push(...baueAst([-0.13, 4.45, 0.02], -1));

  return t;
}

/**
 * Varianten des Waldgotts fuer die Stil-Auswahl in dist/galerie.html. Der
 * Nutzer sucht die beste aus; sie wird dann MODELLE_DEF.waldgott. Vorlage:
 * docs/bilder/vorlagen/waldgott-vorlage.png (nur lokal).
 */
const WALDGOTT_VARIANTEN = {
  'A — bisher': MODELLE_DEF.waldgott,
  'B — Schattenriese': waldgottSchattenriese(),
  'C — Vorlage, düster-realistisch': waldgottVorlage(),
  'D — Kantiges Low-Poly': waldgottKantig(),
  'E — Rinde und Moos': waldgottRinde(),
  'F — Verspielt, große Formen': waldgottVerspielt(),
  'G — Glutherz': waldgottGlutherz(),
  'G.2 — Glutherz (High-Res)': waldgottGlutherz2(),
};

// Das vom Nutzer gewaehlte finale Spiel-Asset: G.2 Glutherz (High-Res)
MODELLE_DEF.waldgott = WALDGOTT_VARIANTEN['G.2 — Glutherz (High-Res)'];



/* ---------------------------------- */

// Platzhalter fuer Modelle und Icons neuer Einheiten und Gebaeude, bis Gemini
// echte liefert (Wunsch in docs/grafik/wuensche.md). Fuellt nur Luecken: Was
// in src/modelle3d.js oder src/icons.js steht, gewinnt. Wird von
// tools/bundle.mjs nach diesen Dateien eingefuegt; in der Draufsicht gibt es
// keine Modelle, daher die typeof-Pruefung.


const PLATZHALTER_ICONS = {
  rabe: '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10c3-2 6-2 8 0l2 3 2-3c2-2 5-2 8 0-3 0-5 1-7 4l-3 4-3-4C7 11 5 10 2 10z" fill="#24232b" stroke="#8fb86a" stroke-width="1"/><circle cx="12" cy="12" r="1" fill="#e8d04a"/></svg>',
  spaehposten: '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22l3-12M18 22l-3-12M8 16h8" stroke="#a07a4a" stroke-width="1.6"/><path d="M5 10h14l-2-3H7z" fill="#7a5a3a" stroke="#d8b06a" stroke-width="1"/><path d="M8 7l4-4 4 4" stroke="#d8b06a" stroke-width="1.2"/><circle cx="12" cy="8.6" r="1.2" fill="#f0e6c8"/></svg>',
};
for (const [k, v] of Object.entries(PLATZHALTER_ICONS)) ICONS[k] ??= v;

if (typeof MODELLE_DEF !== 'undefined') {
  const SCHWARZ = '#24232b';
  const HOLZ_P = '#7a5a3a';
  const PLATZHALTER_MODELLE = {
    // Rabe: Rumpf, zwei Schwingen, Schnabel -- die Flughoehe setzt die Oberflaeche
    rabe: [
      ['k', [0.35, 6], [0, 0.4, 0], SCHWARZ, 0.25],
      ['k', [0.22, 6], [0, 0.5, 0.38], SCHWARZ],
      ['z', [0, 0.08, 0.3, 4], [0, 0.48, 0.66], '#c8a040', 0, [Math.PI / 2, 0, 0]],
      ['q', [1.3, 0.05, 0.45], [0.75, 0.45, 0], SCHWARZ, 0.25, [0, 0, 0.25]],
      ['q', [1.3, 0.05, 0.45], [-0.75, 0.45, 0], SCHWARZ, 0.25, [0, 0, -0.25]],
      ['q', [0.35, 0.04, 0.4], [0, 0.4, -0.45], SCHWARZ],
    ],
    // Spaehposten: Hochsitz auf vier Beinen mit Dach
    spaehposten: [
      ['q', [0.1, 2.2, 0.1], [0.45, 1.1, 0.45], HOLZ_P],

      ['q', [0.1, 2.2, 0.1], [0.45, 1.1, -0.45], HOLZ_P],
      ['q', [0.1, 2.2, 0.1], [-0.45, 1.1, -0.45], HOLZ_P],
      ['q', [1.2, 0.12, 1.2], [0, 2.2, 0], HOLZ_P, 0.4],
      ['q', [1.2, 0.45, 0.06], [0, 2.5, 0.58], HOLZ_P],
      ['q', [1.2, 0.45, 0.06], [0, 2.5, -0.58], HOLZ_P],
      ['z', [0, 0.95, 0.6, 4], [0, 3.1, 0], '#8c3a2a', 0.5, [0, Math.PI / 4, 0]],
    ],

  for (const [k, v] of Object.entries(PLATZHALTER_MODELLE)) MODELLE_DEF[k] ??= v;

/* ---------------------------------- */

// Modell-Galerie: zeigt Modelle drehend nebeneinander, damit der Nutzer den
// Grafikstil auswaehlen kann -- zuerst die Varianten des Waldgotts, dann
// alle Einheiten, Gebaeude, Karte und Effekte, dazu die Icons.
// Gehoert zur Grafik (siehe GEMINI.md). Nutzt denselben Renderer wie die
// 3D-Ansicht (src/render3d.js) und dieselben Modelle (src/modelle3d.js).
// Wird von tools/bundle.mjs zu dist/galerie.html zusammengefuegt.

const leinwand = document.getElementById('leinwand');
const gl = leinwand.getContext('webgl2', { antialias: true, stencil: true });
const TEAMFARBE = { mensch: HEX('#d8b06a'), gott: HEX('#8fb86a') };
const WEISS = [1, 1, 1];
let ansicht = 'waldgott';
let schilderSig = '';
let festerWinkel = null; // aus dem Anker (#einheiten&winkel=0.5 oder #einheiten/winkel=0.5): stehendes Bild fuer Vergleiche
const masse = {}; // Modell -> { hoehe, breite } fuer die Kamera

/** Ein Modell laden und seine Ausdehnung merken. */
function lade(key, teile) {
  const daten = baueModell(teile);
  let hoehe = 0.1;
  let breite = 0.1;
  for (let i = 0; i < daten.length; i += 10) {
    hoehe = Math.max(hoehe, daten[i + 1]);
    breite = Math.max(breite, Math.abs(daten[i]), Math.abs(daten[i + 2]));
  }
  MODELLE[key] = ladeModell(daten);
  masse[key] = { hoehe, breite };
}

/** Was in der aktuellen Ansicht gezeigt wird: Modell, Name, Farbe. */
function eintraege() {
  if (ansicht === 'waldgott') {
    return Object.keys(WALDGOTT_VARIANTEN).map((n) => ({ key: 'variante:' + n, name: n, team: TEAMFARBE.gott }));
  }
  if (ansicht === 'einheiten') {
    return Object.keys(UNITS).map((k) => ({ key: k, name: UNITS[k].name, team: TEAMFARBE[UNITS[k].faction] }));
  }
  if (ansicht === 'gebaeude') {
    return Object.keys(BUILDINGS).map((k) => ({ key: k, name: BUILDINGS[k].name, team: TEAMFARBE[BUILDINGS[k].faction] }));
  }
  const reste = Object.keys(MODELLE_DEF).filter((k) => !UNITS[k] && !BUILDINGS[k] && k !== 'scheibe');
  return reste.map((k) => ({ key: k, name: k, team: WEISS }));
}

/** Raster: so viele Spalten, dass die Zellen etwa quadratisch werden. */
function raster(n, w, h) {
  const spalten = Math.max(1, Math.round(Math.sqrt((n * w) / h)));
  const zeilen = Math.ceil(n / spalten);
  return { spalten, zeilen, zw: w / spalten, zh: h / zeilen };
}

/** Namensschilder als HTML ueber den Zellen; nur neu, wenn sich etwas aendert. */
function schilder(liste, r) {
  const sig = ansicht + '|' + liste.length + '|' + Math.round(r.zw) + 'x' + Math.round(r.zh);
  if (sig === schilderSig) return;
  schilderSig = sig;
  document.getElementById('schilder').innerHTML = liste
    .map((e, i) => {
      const x = (i % r.spalten) * r.zw;
      const y = Math.floor(i / r.spalten) * r.zh;
      return `<div class="schild" style="left:${x}px;top:${y}px">${e.name}</div>`;
    })
    .join('');
}

/** Ein Bild: jede Zelle mit eigener Kamera, das Modell dreht sich langsam. */
function bild(now) {
  requestAnimationFrame(bild);
  if (ansicht === 'icons') return;
  const d = devicePixelRatio || 1;
  const w = leinwand.clientWidth;
  const h = leinwand.clientHeight;
  if (leinwand.width !== ((w * d) | 0) || leinwand.height !== ((h * d) | 0)) {
    leinwand.width = (w * d) | 0;
    leinwand.height = (h * d) | 0;
  }
  const liste = eintraege();
  const r = raster(liste.length, w, h);
  schilder(liste, r);

  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(0, 0, leinwand.width, leinwand.height);
  gl.clearColor(NEBEL[0], NEBEL[1], NEBEL[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(PROG);
  const l = [0.45, 1, 0.3];
  const ll = Math.hypot(...l);
  gl.uniform3f(gl.getUniformLocation(PROG, 'uLicht'), l[0] / ll, l[1] / ll, l[2] / ll);
  gl.uniform3f(gl.getUniformLocation(PROG, 'uNebel'), ...NEBEL);
  gl.uniform1f(gl.getUniformLocation(PROG, 'uRoentgen'), 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sichtTex);
  gl.uniform1i(gl.getUniformLocation(PROG, 'uSicht'), 0);
  gl.uniform1f(gl.getUniformLocation(PROG, 'uKarte'), 1e6);

  const drehung = festerWinkel ?? (now / 1000) * 0.6;
  liste.forEach((e, i) => {
    if (!MODELLE[e.key]) return;
    const x = (i % r.spalten) * r.zw;
    const y = Math.floor(i / r.spalten) * r.zh;
    // GL zaehlt von unten
    const vx = Math.round(x * d);
    const vy = Math.round((h - y - r.zh) * d);
    const vw = Math.round(r.zw * d) - 2;
    const vh = Math.round(r.zh * d) - 2;
    gl.viewport(vx, vy, vw, vh);
    gl.scissor(vx, vy, vw, vh);
    gl.clearColor(0.09, 0.11, 0.08, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const m = masse[e.key];
    const gross = Math.max(m.hoehe, m.breite * 2);
    const abstand = gross * 1.7 + 0.5;
    const ziel = [0, m.hoehe * 0.45, 0];
    const auge = [0, m.hoehe * 0.45 + abstand * 0.45, abstand];
    const vp = m4mul(m4persp(0.7, vw / vh, 0.05, 200), m4look(auge, ziel, [0, 1, 0]));
    gl.uniformMatrix4fv(gl.getUniformLocation(PROG, 'uVP'), false, vp);
    // Boden-Scheibe als Standflaeche
    instanz('scheibe', 0, 0, 0, 0, m.breite * 1.3, [0.2, 0.25, 0.16], 1, 1, 1);
    const schritt = Math.sin(now * 0.003);
    instanz(e.key, 0, 0, 0, drehung, 1, e.team, 1, 1, 1, schritt);
    zeichneInstanzen(MODELLE[e.key]);
  });
  gl.disable(gl.SCISSOR_TEST);
}

/** Icons in drei Groessen, ohne WebGL. */
function iconsZeigen() {
  const namen = { ...Object.fromEntries(Object.entries(UNITS).map(([k, u]) => [k, u.name])), ...Object.fromEntries(Object.entries(BUILDINGS).map(([k, b]) => [k, b.name])) };
  document.getElementById('icons').innerHTML = Object.entries(ICONS)
    .map(
      ([k, svg]) => `<div class="ic"><div class="reihe">
        <span style="width:20px;height:20px">${svg}</span>
        <span style="width:36px;height:36px">${svg}</span>
        <span style="width:64px;height:64px">${svg}</span></div><b>${namen[k] || k}</b></div>`
    )
    .join('');
}

function wechsle(neu) {
  ansicht = neu;
  schilderSig = '';
  for (const b of document.querySelectorAll('#kopf [data-ansicht]')) b.className = b.dataset.ansicht === neu ? 'an' : '';
  const icons = neu === 'icons';
  document.getElementById('icons').style.display = icons ? 'grid' : 'none';
  leinwand.style.display = icons ? 'none' : 'block';
  document.getElementById('schilder').style.display = icons ? 'none' : 'block';
  document.getElementById('hinweis').textContent =
    neu === 'waldgott' ? 'Welche Variante gefällt dir am besten? Nenne ihren Buchstaben.' : 'Teamfarbe: Menschen gold, Gott grün.';
  if (icons) iconsZeigen();
}

let sichtTex = null;
function start() {
  for (const b of document.querySelectorAll('#kopf [data-ansicht]')) b.onclick = () => wechsle(b.dataset.ansicht);
  if (!gl) {
    document.getElementById('nogl').style.display = 'flex';
    return;
  }
  initGL();
  for (const [k, teile] of Object.entries(MODELLE_DEF)) lade(k, teile);
  for (const [n, teile] of Object.entries(WALDGOTT_VARIANTEN)) lade('variante:' + n, teile);
  // Kein Nebel in der Galerie: eine weisse Sicht-Textur
  sichtTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, sichtTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 1, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  // Ansicht aus dem Anker der Adresse, z. B. galerie.html#icons
  const [anker, ...optionen] = (typeof location !== 'undefined' ? location.hash.slice(1) : '').split(/[&/]/);
  for (const o of optionen) if (o.startsWith('winkel=')) festerWinkel = parseFloat(o.slice(7)) || 0;
  if (['waldgott', 'einheiten', 'gebaeude', 'karte', 'icons'].includes(anker)) wechsle(anker);
  requestAnimationFrame(bild);
}
start();

</script>
