/** Alle Ressourcen, die gelagert werden. Gegenwart fliesst und gehoert nicht dazu. */

/** Alle Gebäude bzw. Einheiten einer Fraktion. */
function buildingsOf(f) {
  return Object.keys(BUILDINGS).filter((k) => BUILDINGS[k].faction === f);
}
function unitsOf(f) {
  return Object.keys(UNITS).filter((k) => UNITS[k].faction === f);
}


/* ---------------------------------- */

// Simulationskern. Engine-frei, deterministisch, nur Integer-Arithmetik.
// Siehe CLAUDE.md fuer die Regeln, die dieser Code einhalten muss.

// ---------------------------------------------------------------- Mathematik

/** Deterministischer PRNG (mulberry32). Veraendert state.seed. */
function rng(state) {
  state.seed = (state.seed + 0x6d2b79f5) | 0;
  let t = state.seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) % 1000000;
}

/** Integer-Wurzel. Kein Math.sqrt: Gleitkomma ist nicht plattformstabil. */
function isqrt(n) {
  if (n <= 0) return 0;
  let x = n;
  let y = (x + 1) >> 1;
  while (y < x) {
    x = y;
    y = (x + ((n / x) | 0)) >> 1;
  }
  return x;
}
function dist2(ax, ay, bx, by) {
  const dx = ax - bx;
  const dy = ay - by;
  return dx * dx + dy * dy;
}
function dist(ax, ay, bx, by) {
  return isqrt(dist2(ax, ay, bx, by));
}

// ------------------------------------------------- DIE EINE REGEL

/**
 * Der Radius eines Ankers. Das ist die gesamte Asymmetrie zwischen den
 * Fraktionen: eine Zeile, drei Zahlen aus FACTIONS[f].growth.
 *
 *   Menschen -> start == max, perTick 0  -> fest ab Bauende
 *   Gott     -> start klein, waechst     -> frueh winzig, spaet riesig
 */
function anchorRadius(world, e) {
  if (!BUILDINGS[e.type].anchor || !e.done) return 0;
  const g = FACTIONS[world.players[e.player].faction].growth;
  const age = world.tick - e.doneAt;
  return Math.min(g.max, g.start + age * g.perTick);
}

const PER_MIN = 600 * 1000;

// ------------------------------------------------------------------ Weltbau
function createWorld(opts = {}) {
  const f0 = opts.factions?.[0] ?? 'mensch';
  const f1 = opts.factions?.[1] ?? 'gott';
  const world = {
    tick: 0,
    seed: opts.seed ?? 12345,
    nextId: 1,
    entities: [],
    players: [
      { id: 0, faction: f0, fron: START_FRON, goetterblut: 0, alive: true },
      { id: 1, faction: f1, fron: START_FRON, goetterblut: 0, alive: true },
    ],
    deposits: [],
    cleared: [], // gerodete Flaechen: { x, y, r }
    regions: [],
    pending: [],
    events: [],
    over: false,
    winner: -1,
  };
  if (!opts.empty) setupMap(world);
  return world;
}

function setupMap(world) {
  const lo = 3000;
  const hi = MAP - 3000;

  for (let p = 0; p < 2; p++) {
    const f = world.players[p].faction;
    const home = f === 'mensch' ? 'halle' : 'herzbaum';
    spawnBuilding(world, p, home, p === 0 ? lo : hi, p === 0 ? lo : hi, true);
  }
  if (RULES.kommandanten) for (let p = 0; p < 2; p++) spawnKommandant(world, p);

  const spots = [
    [lo + 1800, lo - 800],
    [lo - 800, lo + 1800],
    [lo + 3200, lo + 1500],
    [hi - 1800, hi + 800],
    [hi + 800, hi - 1800],
    [hi - 3200, hi - 1500],
    // Mitte: punktsymmetrisch, je eine Ader naeher an jedem Spieler.
    [MAP >> 1, (MAP >> 1) - 2600],
    [MAP >> 1, (MAP >> 1) + 2600],
  ];
  for (const [x, y] of spots) {
    world.deposits.push({ x: clamp(x), y: clamp(y), kind: 'fron', takenBy: 0 });
  }
  // Goetterblut: drei Adern auf der Mittelachse, der Streitpunkt.
  world.deposits.push({ x: MAP >> 1, y: MAP >> 1, kind: 'goetterblut', takenBy: 0 });
  world.deposits.push({ x: (MAP >> 1) - 3400, y: (MAP >> 1) + 3400, kind: 'goetterblut', takenBy: 0 });
  world.deposits.push({ x: (MAP >> 1) + 3400, y: (MAP >> 1) - 3400, kind: 'goetterblut', takenBy: 0 });
}

function clamp(v) {
  return Math.max(300, Math.min(MAP - 300, v));
}
function spawnBuilding(world, player, type, x, y, finished = false) {
  const def = BUILDINGS[type];
  const e = {
    id: world.nextId++,
    kind: 'building',
    type,
    player,
    x: x | 0,
    y: y | 0,
    hp: finished ? def.hp : Math.max(1, def.hp / 10) | 0,
    maxHp: def.hp,
    done: finished,
    doneAt: finished ? 0 : -1,
    progress: finished ? def.buildTime * 1000 : 0,
    region: -1,
    powered: 1000,
    queue: [],
    spawned: 0,
    hilfe: 0, // Baukraft eines Kommandanten in diesem Tick, siehe erschaffen()
    queueProgress: 0,
    cooldown: 0,
    dead: false,
  };
  world.entities.push(e);
  if (finished && def.clears) clearGround(world, e);
  return e;
}
function spawnUnit(world, player, type, x, y) {
  const def = UNITS[type];
  const e = {
    id: world.nextId++,
    kind: 'unit',
    type,
    player,
    x: x | 0,
    y: y | 0,
    hp: def.hp,
    maxHp: def.hp,
    tx: x | 0,
    ty: y | 0,
    arrived: true, // hat den Befehlspunkt erreicht -- erst dann wird verfolgt
    aggro: false, // Angriffsbewegung: unterwegs jeden Feind in der Naehe stellen
    cooldown: 0,
    dead: false,
  };
  world.entities.push(e);
  return e;
}

/**
 * Setzt den Kommandanten eines Spielers neben sein Hauptgebaeude, zur
 * Kartenmitte hin. Einmalig zu Spielbeginn -- es gibt keinen zweiten.
 */
function spawnKommandant(world, player) {
  let haupt = null;
  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (!e.dead && e.player === player && e.kind === 'building' && BUILDINGS[e.type].vital) haupt = e;
  }
  if (!haupt) return null;
  const type = FACTIONS[world.players[player].faction].kommandant;
  const off = BUILDINGS[haupt.type].radius + 250;
  const dx = (MAP >> 1) - haupt.x;
  const dy = (MAP >> 1) - haupt.y;
  const d = isqrt(dx * dx + dy * dy) || 1;
  const x = clamp(haupt.x + (((dx * off) / d) | 0));
  const y = clamp(haupt.y + (((dy * off) / d) | 0));
  const u = spawnUnit(world, player, type, x, y);
  world.events.push({ t: 'spawned', id: u.id });
  return u;
}

/** Der lebende Kommandant eines Spielers, oder null. */
function kommandantVon(world, player) {
  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (!e.dead && e.player === player && e.kind === 'unit' && UNITS[e.type].commander) return e;
  }
  return null;
}

/** Ein Saegewerk rodet den Boden ringsum. Dort kann der Gott nicht pflanzen. */
function clearGround(world, e) {
  world.cleared.push({ x: e.x, y: e.y, r: BUILDINGS[e.type].clears });
  world.events.push({ t: 'cleared', x: e.x, y: e.y, r: BUILDINGS[e.type].clears });
}
function isCleared(world, x, y) {
  for (let i = 0; i < world.cleared.length; i++) {
    const c = world.cleared[i];
    if (dist2(x, y, c.x, c.y) <= c.r * c.r) return true;
  }
  return false;
}

// ------------------------------------------------------------------ Befehle
function issue(world, cmd) {
  world.pending.push(cmd);
}

/**
 * Befehle reihum: in jedem Tick beginnt ein anderer Spieler. Wollen zwei
 * dieselbe Ader im selben Tick, gewinnt nicht immer derselbe Sitzplatz.
 * Innerhalb eines Spielers bleibt die Reihenfolge seiner Befehle erhalten.
 */
function applyCommands(world) {
  const n = world.players.length;
  for (let k = 0; k < n; k++) {
    const player = (world.tick + k) % n;
    for (let i = 0; i < world.pending.length; i++) {
      if (world.pending[i].player === player) applyCommand(world, world.pending[i]);
    }
  }
  world.pending.length = 0;
}

function applyCommand(world, c) {
  {
    if (c.type === 'move' || c.type === 'attack') {
      for (let k = 0; k < c.ids.length; k++) {
        const e = byId(world, c.ids[k]);
        if (e && e.kind === 'unit' && e.player === c.player && !e.dead) {
          e.tx = c.x | 0;
          e.ty = c.y | 0;
          e.arrived = false;
          e.aggro = c.type === 'attack';
        }
      }
    } else if (c.type === 'build') {
      tryPlace(world, c.player, c.building, c.x | 0, c.y | 0);
    } else if (c.type === 'demolish') {
      demolish(world, c.player, c.id);
    } else if (c.type === 'produce') {
      const e = byId(world, c.id);
      if (e && e.player === c.player && e.done && !e.dead) {
        const def = BUILDINGS[e.type];
        if (def.buildList && def.buildList.includes(c.unit) && e.queue.length < 8) {
          const p = world.players[c.player];
          if (canAfford(p, UNITS[c.unit].cost)) {
            pay(p, UNITS[c.unit].cost, 1000);
            e.queue.push(c.unit);
          }
        }
      }
    }
  }
}

/**
 * Platzierung. Bauen ausserhalb der eigenen Domaene ist erlaubt -- die
 * Baustelle hat dann nur keine Gegenwart und steht still. Genau darum geht es.
 */
function tryPlace(world, player, type, x, y) {
  const def = BUILDINGS[type];
  if (!def || def.vital) return null;
  if (def.faction !== world.players[player].faction) return null;
  const p = world.players[player];
  if (!canAfford(p, def.cost)) return null;
  if (x < 200 || y < 200 || x > MAP - 200 || y > MAP - 200) return null;

  let dep = null;
  if (def.needs) {
    dep = findDeposit(world, x, y, def.needs);
    if (!dep || dep.takenBy !== 0) return null;
    x = dep.x;
    y = dep.y;
  }
  // Ein Hain braucht ungerodeten Boden.
  if (def.needsGrowth && isCleared(world, x, y)) return null;

  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (e.dead || e.kind !== 'building') continue;
    const min = def.radius + BUILDINGS[e.type].radius;
    if (dist2(x, y, e.x, e.y) < min * min) return null;
  }

  pay(p, def.cost, 1000);
  const b = spawnBuilding(world, player, type, x, y, false);
  if (dep) dep.takenBy = b.id;
  return b;
}

/**
 * Abriss. Ein Ausweg aus Fehlplanungen: Baustellen bringen drei Viertel der
 * Kosten zurueck, fertige Gebaeude die Haelfte, Bauauftraege voll. Gerodeter
 * Boden bleibt gerodet. Hauptgebaeude lassen sich nicht abreissen.
 */
function demolish(world, player, id) {
  const e = byId(world, id);
  if (!e || e.dead || e.kind !== 'building' || e.player !== player) return false;
  const def = BUILDINGS[e.type];
  if (def.vital) return false;
  const p = world.players[player];
  const vorher = p.fron;
  pay(p, def.cost, e.done ? -500 : -750);
  for (let i = 0; i < e.queue.length; i++) pay(p, UNITS[e.queue[i]].cost, -1000);
  e.dead = true;
  world.events.push({ t: 'demolished', id: e.id, x: e.x, y: e.y, fron: p.fron - vorher });
  return true;
}

/** Reicht der Vorrat fuer diese Kosten? Kosten sind { ressource: menge }. */
function canAfford(p, cost) {
  for (let i = 0; i < RESOURCES.length; i++) {
    const r = RESOURCES[i];
    if ((cost[r] || 0) > p[r]) return false;
  }
  return true;
}

/** Zieht Kosten ab (promille > 0) oder erstattet sie anteilig (promille < 0). */
function pay(p, cost, promille) {
  for (let i = 0; i < RESOURCES.length; i++) {
    const r = RESOURCES[i];
    if (cost[r]) p[r] -= ((cost[r] * promille) / 1000) | 0;
  }
}
function findDeposit(world, x, y, kind, maxDist = 700) {
  let best = null;
  let bestD = maxDist * maxDist;
  for (let i = 0; i < world.deposits.length; i++) {
    const d = world.deposits[i];
    if (d.kind !== kind) continue;
    const dd = dist2(x, y, d.x, d.y);
    if (dd <= bestD) {
      bestD = dd;
      best = d;
    }
  }
  return best;
}
function byId(world, id) {
  for (let i = 0; i < world.entities.length; i++) {
    if (world.entities[i].id === id) return world.entities[i];
  }
  return null;
}

// ------------------------------------------------------- Domäne und Gegenwart

/** Gegenwart, die ein Anker mit diesem Radius spendet (RULES.ankerKraft). */
function ankerGegenwart(r) {
  return ((r * RULES.ankerKraft) / 1000) | 0;
}

/** Liegt der Punkt in der Domäne dieses Spielers? */
function inDomain(world, player, x, y) {
  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (e.dead || e.player !== player || e.kind !== 'building') continue;
    const r = anchorRadius(world, e);
    if (r > 0 && dist2(x, y, e.x, e.y) <= r * r) return true;
  }
  return false;
}

/** Wie tief liegt der Punkt in der eigenen Domaene? Abstand zum naechsten Rand, 0 = draussen. */
function domainDepth(world, player, x, y) {
  let best = 0;
  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (e.dead || e.player !== player || e.kind !== 'building') continue;
    const r = anchorRadius(world, e);
    if (r === 0) continue;
    const t = r - isqrt(dist2(x, y, e.x, e.y));
    if (t > best) best = t;
  }
  return best;
}

/** Liegt der Punkt in der Domaene irgendeines anderen Spielers? */
function inForeignDomain(world, player, x, y) {
  for (let p = 0; p < world.players.length; p++) {
    if (p !== player && inDomain(world, p, x, y)) return true;
  }
  return false;
}

/**
 * Regionen: zusammenhaengende Teile einer Domäne. Zwei Gebäude gehoeren
 * zusammen, wenn sich ihre Ankerkreise ueberschneiden -- oder wenn ein
 * Nicht-Anker im Kreis eines Ankers steht.
 */
function computeRegions(world) {
  const bs = [];
  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (!e.dead && e.kind === 'building') {
      e.region = -1;
      e.anchorR = anchorRadius(world, e);
      bs.push(e);
    }
  }

  const linked = (a, b) => {
    if (a.player !== b.player) return false;
    const d2 = dist2(a.x, a.y, b.x, b.y);
    const ra = a.anchorR;
    const rb = b.anchorR;
    if (ra > 0 && rb > 0) return d2 <= (ra + rb) * (ra + rb);
    if (ra > 0) return d2 <= ra * ra;
    if (rb > 0) return d2 <= rb * rb;
    return false; // zwei Nicht-Anker verbinden sich nie direkt
  };

  const regions = [];
  for (let i = 0; i < bs.length; i++) {
    if (bs[i].region !== -1) continue;
    const idx = regions.length;
    const members = [];
    const stack = [bs[i]];
    bs[i].region = idx;
    while (stack.length) {
      const cur = stack.pop();
      members.push(cur);
      for (let j = 0; j < bs.length; j++) {
        const other = bs[j];
        if (other.region !== -1) continue;
        if (linked(cur, other)) {
          other.region = idx;
          stack.push(other);
        }
      }
    }
    members.sort((a, b) => a.id - b.id);
    regions.push({
      index: idx,
      player: members[0].player,
      members,
      supply: 0,
      demand: 0,
      byPrio: [0, 0, 0, 0],
      satPrio: [1000, 1000, 1000, 1000],
    });
  }
  world.regions = regions;
  return regions;
}
function distributeGegenwart(world) {
  for (let r = 0; r < world.regions.length; r++) {
    const reg = world.regions[r];
    let supply = 0;
    const demand = [0, 0, 0, 0];

    for (let i = 0; i < reg.members.length; i++) {
      const e = reg.members[i];
      const def = BUILDINGS[e.type];
      if (e.done && def.gegenwartOut) supply += def.gegenwartOut;
      if (e.anchorR > 0) supply += ankerGegenwart(e.anchorR);
      const d = demandOf(e);
      if (d > 0) demand[prioOf(e)] += d;
    }

    reg.supply = supply;
    reg.demand = demand[0] + demand[1] + demand[2] + demand[3];
    reg.byPrio = demand;

    // Mindestfluss: ein kleiner Teil bleibt fuer Werk reserviert, damit eine
    // ueberbuchte Domaene sich selbst aus dem Loch bauen kann.
    const reserve = Math.min(demand[PRIO.werk], ((supply * RULES.werkFloor) / 1000) | 0);
    let left = supply - reserve;
    for (let p = 0; p < 4; p++) {
      if (p === PRIO.werk) left += reserve;
      if (demand[p] === 0) {
        reg.satPrio[p] = 1000;
        continue;
      }
      if (left >= demand[p]) {
        reg.satPrio[p] = 1000;
        left -= demand[p];
      } else {
        reg.satPrio[p] = ((left * 1000) / demand[p]) | 0;
        left = 0;
      }
    }

    for (let i = 0; i < reg.members.length; i++) {
      const e = reg.members[i];
      e.powered = demandOf(e) > 0 ? reg.satPrio[prioOf(e)] : 1000;
    }
  }
}

function demandOf(e) {
  const def = BUILDINGS[e.type];
  if (!e.done) return Math.max(8, (def.gegenwartIn || 20) >> 1);
  if (!def.gegenwartIn) return 0;
  if (def.buildList && e.queue.length === 0) return 0;
  return def.gegenwartIn;
}

function prioOf(e) {
  const def = BUILDINGS[e.type];
  if (!e.done) return PRIO.werk;
  return def.prio === undefined ? PRIO.segen : def.prio;
}

// --------------------------------------------------------------- Tick
function step(world) {
  if (world.over) return world;
  world.events.length = 0;
  applyCommands(world);
  computeRegions(world);
  distributeGegenwart(world);
  erschaffen(world);

  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (e.dead || e.kind !== 'building') continue;
    const def = BUILDINGS[e.type];

    if (!e.done) {
      // Leben waechst mit dem Fortschritt, Schaden bleibt aber stehen:
      // es kommt nur der Zuwachs dazu, nicht der Sollwert.
      const need = def.buildTime * 1000;
      const before = siteHp(def, e.progress, need);
      e.progress += e.powered + e.hilfe;
      e.hilfe = 0;
      e.hp = Math.min(def.hp, e.hp + siteHp(def, e.progress, need) - before);
      if (e.progress >= need) {
        e.done = true;
        e.doneAt = world.tick;
        if (def.clears) clearGround(world, e);
        world.events.push({ t: 'built', id: e.id });
      }
      continue;
    }

    const pl = world.players[e.player];
    if (def.fronOut) pl.fronAcc = (pl.fronAcc || 0) + def.fronOut * e.powered;
    if (def.blutOut) pl.blutAcc = (pl.blutAcc || 0) + def.blutOut * e.powered;

    if (e.queue.length > 0) {
      e.queueProgress += e.powered;
      const need = UNITS[e.queue[0]].buildTime * 1000;
      if (e.queueProgress >= need) {
        const type = e.queue.shift();
        e.queueProgress = 0;
        // Einheiten treten zur Kartenmitte hin aus, seitlich gestreut nach
        // einem Zaehler je Gebaeude. Punktsymmetrisch: beide Sitzplaetze
        // erhalten dieselbe Lage. Versatz zur Null hin runden, nicht die Summe.
        const off = def.radius + 90;
        const quer = ((e.spawned % 5) - 2) * 60;
        e.spawned++;
        let dx = (MAP >> 1) - e.x;
        let dy = (MAP >> 1) - e.y;
        let d = isqrt(dx * dx + dy * dy);
        if (d === 0) {
          dx = 1;
          dy = 0;
          d = 1;
        }
        const ux = e.x + (((dx * off - dy * quer) / d) | 0);
        const uy = e.y + (((dy * off + dx * quer) / d) | 0);
        const u = spawnUnit(world, e.player, type, clamp(ux), clamp(uy));
        world.events.push({ t: 'spawned', id: u.id });
      }
    }
  }

  for (let p = 0; p < world.players.length; p++) {
    const pl = world.players[p];
    // Foerderung ist pro Minute angegeben, powered in Promille: 600 Ticks x 1000.
    if (pl.fronAcc) {
      pl.fron += (pl.fronAcc / PER_MIN) | 0;
      pl.fronAcc %= PER_MIN;
    }
    if (pl.blutAcc) {
      pl.goetterblut += (pl.blutAcc / PER_MIN) | 0;
      pl.blutAcc %= PER_MIN;
    }
  }

  moveUnits(world);
  combat(world);
  cleanup(world);

  world.tick++;
  return world;
}

/**
 * Erschaffen: Jeder Kommandant gibt der naechsten eigenen Baustelle in
 * seiner Reichweite seine Baukraft -- zusaetzlich zur Gegenwart und auch
 * ausserhalb der Domaene. Lagen vom Tickbeginn, also reihenfolgefrei.
 */
function erschaffen(world) {
  for (let i = 0; i < world.entities.length; i++) {
    const u = world.entities[i];
    if (u.dead || u.kind !== 'unit') continue;
    const b = UNITS[u.type].build;
    if (!b) continue;
    u.baut = 0;
    let best = null;
    let bestD = b.range * b.range;
    for (let k = 0; k < world.entities.length; k++) {
      const e = world.entities[k];
      if (e.dead || e.kind !== 'building' || e.done || e.player !== u.player) continue;
      const dd = dist2(u.x, u.y, e.x, e.y);
      if (dd < bestD) {
        bestD = dd;
        best = e;
      }
    }
    if (best) {
      best.hilfe += b.power;
      u.baut = best.id;
    }
  }
}

/** Leben einer Baustelle beim Fortschritt progress: ein Zehntel bis voll. */
function siteHp(def, progress, need) {
  const frac = Math.min(1000, ((progress * 1000) / need) | 0);
  const base = (def.hp / 10) | 0;
  return base + (((def.hp - base) * frac) / 1000) | 0;
}

/** Cosinus in Promille aus einer festen Tabelle. Kein Gleitkomma im Zustand. */
function cosDeg(a) {
  return COS[((a % 360) + 360) % 360];
}
function sinDeg(a) {
  return COS[(((a + 270) % 360) + 360) % 360];
}
const COS = (() => {
  const t = new Int32Array(360);
  for (let i = 0; i < 360; i++) t[i] = Math.round(Math.cos((i * Math.PI) / 180) * 1000);
  return t;
})();

// Verfolgung: Wer seinen Befehlspunkt erreicht hat, geht auf Feinde in
// Reichweite + CHASE los, entfernt sich aber hoechstens LEASH vom
// Befehlspunkt und kehrt danach dorthin zurueck. Ein Bewegungsbefehl hat
// Vorrang: Unterwegs wird nur im Vorbeigehen geschossen. Bei einer
// Angriffsbewegung ('attack') wird auch unterwegs verfolgt, ohne Leine,
// danach geht es weiter zum Ziel.
const CHASE = 600;
const LEASH = 1500;

function moveUnits(world) {
  // Erst alle Ziele aus denselben Ausgangslagen, dann alle bewegen --
  // sonst haengt die Verfolgung von der Reihenfolge in der Liste ab.
  const us = [];
  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (!e.dead && e.kind === 'unit') us.push(e);
  }
  const gx = new Int32Array(us.length);
  const gy = new Int32Array(us.length);
  for (let i = 0; i < us.length; i++) {
    const e = us[i];
    gx[i] = e.tx;
    gy[i] = e.ty;
    const w = UNITS[e.type].weapon;
    if (!w || !(e.arrived || e.aggro)) continue;
    const leine = e.arrived ? LEASH + w.range : MAP * 2;
    const o = chaseTarget(world, e, w.range + CHASE, leine);
    if (!o) continue;
    const nah = w.range - 20;
    if (dist2(e.x, e.y, o.x, o.y) > nah * nah) {
      gx[i] = o.x;
      gy[i] = o.y;
    } else {
      gx[i] = e.x; // in Reichweite: stehen bleiben und schiessen
      gy[i] = e.y;
    }
  }
  for (let i = 0; i < us.length; i++) {
    const e = us[i];
    const speed = UNITS[e.type].speed;
    const dx = gx[i] - e.x;
    const dy = gy[i] - e.y;
    const d = isqrt(dx * dx + dy * dy);
    if (d <= speed) {
      e.x = gx[i];
      e.y = gy[i];
    } else {
      e.x += ((dx * speed) / d) | 0;
      e.y += ((dy * speed) / d) | 0;
    }
    if (e.x === e.tx && e.y === e.ty) e.arrived = true;
  }
  separate(world);
}

/** Naechster Feind im Umkreis r der Einheit, der nicht weiter als leash vom Befehlspunkt liegt. */
function chaseTarget(world, e, r, leash) {
  let best = null;
  let bestD = r * r;
  for (let i = 0; i < world.entities.length; i++) {
    const o = world.entities[i];
    if (o.dead || o.player === e.player) continue;
    const dd = dist2(e.x, e.y, o.x, o.y);
    if (dd >= bestD) continue;
    if (dist2(e.tx, e.ty, o.x, o.y) > leash * leash) continue;
    bestD = dd;
    best = o;
  }
  return best;
}

function separate(world) {
  const us = [];
  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (!e.dead && e.kind === 'unit') us.push(e);
  }
  // Alle Stoesse aus denselben Ausgangslagen, dann gemeinsam anwenden --
  // sonst haengt das Ergebnis von der Reihenfolge in der Liste ab.
  const px = new Int32Array(us.length);
  const py = new Int32Array(us.length);
  for (let i = 0; i < us.length; i++) {
    for (let j = i + 1; j < us.length; j++) {
      const a = us[i];
      const b = us[j];
      const min = UNITS[a.type].radius + UNITS[b.type].radius;
      const dd = dist2(a.x, a.y, b.x, b.y);
      if (dd >= min * min || dd === 0) continue;
      const d = isqrt(dd) || 1;
      const push = ((min - d) / 2) | 0 || 1;
      const nx = (((a.x - b.x) * push) / d) | 0;
      const ny = (((a.y - b.y) * push) / d) | 0;
      px[i] += nx;
      py[i] += ny;
      px[j] -= nx;
      py[j] -= ny;
    }
  }
  for (let i = 0; i < us.length; i++) {
    us[i].x = clamp(us[i].x + px[i]);
    us[i].y = clamp(us[i].y + py[i]);
  }
  for (let i = 0; i < us.length; i++) umgehen(world, us[i]);
}

/**
 * Gebaeude sind fest. Wer hineingeraet, wird an den Rand geschoben und
 * gleitet seitlich in die Richtung, in der sein Ziel liegt -- ein Ersatz
 * fuer Pathfinding auf offener Karte. Liegt das Ziel im Gebaeude selbst
 * (Angriff aufs Hauptgebaeude), bleibt die Einheit am Rand stehen.
 */
function umgehen(world, u) {
  const ur = UNITS[u.type].radius;
  const slide = UNITS[u.type].speed >> 1;
  for (let i = 0; i < world.entities.length; i++) {
    const b = world.entities[i];
    if (b.dead || b.kind !== 'building') continue;
    const min = ur + BUILDINGS[b.type].radius;
    let ox = u.x - b.x;
    let oy = u.y - b.y;
    const dd = ox * ox + oy * oy;
    if (dd >= min * min) continue;
    let d = isqrt(dd);
    if (d === 0) {
      ox = 1;
      oy = 0;
      d = 1;
    }
    let nx = b.x + (((ox * min) / d) | 0);
    let ny = b.y + (((oy * min) / d) | 0);

/**
 * Kampf wird gleichzeitig aufgeloest: erst waehlt jeder Schuetze sein Ziel,
 * dann trifft alles auf einmal. Sonst schoesse, wer frueher in der Liste

function combat(world) {

    const def = e.kind === 'unit' ? UNITS[e.type] : BUILDINGS[e.type];
    if (!def.weapon) continue;
    if (e.kind === 'building' && !e.done) continue;
    if (e.cooldown > 0) {
      e.cooldown--;
      continue;
    }
    const target = nearestEnemy(world, e, def.weapon.range);
    if (!target) continue;

    let dmg = def.weapon.damage;

    if (def.homeBonus && RULES.tiefeVoll === 0 && inDomain(world, e.player, e.x, e.y)) {

  for (let i = 0; i < shots.length; i += 2) {

      target.dead = true;

        t: 'died',
        id: target.id,
        kind: target.kind,
        type: target.type,
        player: target.player,
        x: target.x,
        y: target.y,

    if (dd <= bestD) {
      bestD = dd;
      best = o;

function cleanup(world) {
  let any = false;
  for (let i = 0; i < world.entities.length; i++) {
    if (world.entities[i].dead) {
      any = true;
      break;
    }
  }
  if (!any) return;

  for (let i = 0; i < world.entities.length; i++) {
    const e = world.entities[i];
    if (!e.dead) continue;
    for (let d = 0; d < world.deposits.length; d++) {
      if (world.deposits[d].takenBy === e.id) world.deposits[d].takenBy = 0;
    }
    // Hauptgebaeude und Kommandant sind vital: Faellt einer, ist die Partie verloren.
    const vital = e.kind === 'building' ? BUILDINGS[e.type].vital : UNITS[e.type].commander;
    if (vital) world.players[e.player].alive = false;

  world.entities = world.entities.filter((e) => !e.dead);

  const alive = world.players.filter((p) => p.alive);
  if (alive.length === 1) {

    world.winner = alive[0].id;
  }

      index: r.index,
      supply: r.supply,
      demand: r.demand,
      satPrio: r.satPrio.slice(),
      size: r.members.length,

// Einfacher Gegner. Bewusst dumm: er soll Druck erzeugen, damit sich die
// Domänenmechanik unter Stress zeigt. Nutzt nur issue(), nie direkten Zugriff.
// Nur Integer-Arithmetik und rng() -- dieselben Regeln wie die Simulation.


const PLAN = {
  mensch: { anker: 'turm', kraft: 'schmiede', fron: 'saege', blut: 'schacht', fabrik: 'kaserne', leicht: 'landwehr', schwer: 'soeldner' },
  gott: { anker: 'hain', kraft: 'quelle', fron: 'moos', blut: 'blutwurz', fabrik: 'dickicht', leicht: 'schratt', schwer: 'geweihter' },
};

/**
 * Spielstile, fraktionsneutral. Messungen mit nur einem Stil messen vor
 * allem diesen Stil (docs/scope.md); tools/sweep.mjs kann alle Paarungen
 * gegeneinander spielen lassen.
 *   welle:     Truppen fuer die erste Welle, plus wellePlus je weitere
 *   ankerAb:   Fron-Polster, ab dem zusaetzliche Anker gesetzt werden
 *   ankerTakt: Minuten je zusaetzlichem Anker

 *              den Adern) statt hinten beim Hauptgebaeude zu bauen

  sturm: { welle: 5, wellePlus: 2, ankerAb: 400, ankerTakt: 2, kdtVorn: true, wache: 2 },
  standard: { welle: 8, wellePlus: 3, ankerAb: 250, ankerTakt: 1, kdtVorn: false, wache: 3 },
  burg: { welle: 14, wellePlus: 4, ankerAb: 150, ankerTakt: 1, kdtVorn: false, wache: 4 },

// Wie weit "hinten" fuer die KI reicht: Umkreis um das eigene Hauptgebaeude.

function stepAI(ai, world) {

  const haupt = mine.find((e) => e.kind === 'building' && BUILDINGS[e.type].vital);
  if (!haupt) return;

  const einheiten = mine.filter((e) => e.kind === 'unit');

    const reichweite = UNITS[kdt.type].build.range - 150;
    const vorn = ziel ? vordersterAnker(world, bauten, ziel) : null;
    const hin = site || (vene && !veneBereit && sicher(vene, 2000) ? vene : vorn);
    const nah = site ? reichweite : 700;
    if (hin && dist2(kdt.x, kdt.y, hin.x, hin.y) > nah * nah && (kdt.tx !== hin.x || kdt.ty !== hin.y)) {
      issue(world, { type: 'move', player: ai.player, ids: [kdt.id], x: hin.x, y: hin.y });
    }
  }

  // 9b. Leibwache folgt dem Kommandanten.
  if (kdt && !bedrohung) {
    const ids = wache.filter((u) => dist2(u.x, u.y, kdt.x, kdt.y) > 600 * 600).map((u) => u.id);
    if (ids.length) issue(world, { type: 'move', player: ai.player, ids, x: kdt.x, y: kdt.y });
  }

  // 9. Sammeln am vordersten Anker. Wer wartet, wartet an der Grenze -- dort,
  //    wo die eigene Domaene dem Gegner am naechsten ist.
  if (!bedrohung && ziel) {
    const vorn = vordersterAnker(world, bauten, ziel);
    if (vorn) {
      const ids = daheimStehend
        .filter((u) => dist2(u.x, u.y, vorn.x, vorn.y) > 700 * 700)
        .map((u) => u.id);
      if (ids.length) issue(world, { type: 'move', player: ai.player, ids, x: vorn.x, y: vorn.y });
    }
  }
}

/**
 * Bauplatz fuer einen Anker: in der eigenen Domaene (sonst steht die
 * Baustelle ohne Gegenwart), im Halbkreis Richtung Front, und dort, wo der
 * naechste eigene Anker am weitesten weg ist.
 */
function randplatz(world, ai, haupt, front, bauten, typ) {
  const def = BUILDINGS[typ];
  const anker = bauten.filter((b) => BUILDINGS[b.type].anchor);
  const versatz = (rng(ai) % 9) - 4;
  let best = null;
  let bestS = -1;
  for (let g = -90; g <= 90; g += 10) {
    const grad = front + g + versatz;
    for (let d = 1000; d <= 14000; d += 400) {
      const x = grenze(haupt.x + (((d * cosDeg(grad)) / 1000) | 0));
      const y = grenze(haupt.y + (((d * sinDeg(grad)) / 1000) | 0));
      if (!inDomain(world, ai.player, x, y)) continue;
      if (def.needsGrowth && isCleared(world, x, y)) continue;
      if (blockiert(world, x, y, def.radius)) continue;
      let s = Infinity;
      for (const a of anker) s = Math.min(s, dist2(x, y, a.x, a.y));
      if (s > bestS) {
        bestS = s;
        best = { x, y };
      }
    }
  }
  return best;
}

/** Liegt der Punkt im Kreis eines eigenen fertigen Ankers, dessen Netz Gegenwart hat? */
function versorgt(world, me, pt) {
  for (const e of world.entities) {
    if (e.dead || e.player !== me || e.kind !== 'building') continue;
    const r = anchorRadius(world, e);
    if (r === 0 || dist2(pt.x, pt.y, e.x, e.y) > r * r) continue;
    const reg = world.regions[e.region];
    if (reg && reg.supply > 0) return true;
  }
  return false;
}

/**
 * Bauplatz fuer einen Anker auf dem Weg zu einer Ader: der Punkt der eigenen
 * Domaene, der ihr am naechsten liegt. Gesucht wird auf der Linie von der
 * Ader zum Hauptgebaeude, mit etwas seitlichem Spielraum.
 */
function vorstoss(world, me, haupt, ziel, typ) {
  const def = BUILDINGS[typ];
  const dx = haupt.x - ziel.x;
  const dy = haupt.y - ziel.y;
  const d = isqrt(dx * dx + dy * dy);
  if (d === 0) return null;
  for (let s = 0; s <= d; s += 300) {
    for (const quer of [0, 300, -300, 600, -600]) {
      const x = grenze(ziel.x + (((dx * s - dy * quer) / d) | 0));
      const y = grenze(ziel.y + (((dy * s + dx * quer) / d) | 0));
      if (!inDomain(world, me, x, y)) continue;
      if (def.needsGrowth && isCleared(world, x, y)) continue;
      if (blockiert(world, x, y, def.radius)) continue;
      return { x, y };
    }
  }
  return null;
}

/**
 * Freier Bauplatz im Abstand abstand von um, zuerst Richtung Heimat, dann
 * seitlich gedreht. Ohne Ader-Pflicht; Hain nicht auf gerodetem Boden.
 */
function nahePlatz(world, um, haupt, abstand, radius, typ, drehung = 0) {
  const basis = winkel(um, haupt);
  for (const g of [0, 40, -40, 80, -80, 120, -120, 180]) {
    const grad = basis + drehung + g;
    const x = grenze(um.x + (((abstand * cosDeg(grad)) / 1000) | 0));
    const y = grenze(um.y + (((abstand * sinDeg(grad)) / 1000) | 0));
    if (BUILDINGS[typ].needsGrowth && isCleared(world, x, y)) continue;
    if (blockiert(world, x, y, radius)) continue;
    // Nicht auf eine Ader bauen, die noch gebraucht wird.
    if (world.deposits.some((d) => dist2(d.x, d.y, x, y) < (radius + 120) * (radius + 120))) continue;
    return { x, y };
  }
  return null;
}

/** Steht hier schon ein Gebaeude im Weg? Dieselbe Regel wie tryPlace(). */
function blockiert(world, x, y, radius) {
  for (const e of world.entities) {
    if (e.dead || e.kind !== 'building') continue;
    const min = radius + BUILDINGS[e.type].radius + 20;
    if (dist2(x, y, e.x, e.y) < min * min) return true;
  }
  return false;
}

/** Feindliche Kaempfer im Umkreis r um einen Punkt. */
function feindeBei(world, me, pt, r) {
  let n = 0;
  for (const o of world.entities) {
    if (o.dead || o.player === me || o.kind !== 'unit' || !UNITS[o.type].weapon) continue;
    if (dist2(o.x, o.y, pt.x, pt.y) <= r * r) n++;
  }
  return n;
}

/** Fertiger Anker, der dem Ziel am naechsten steht. */
function vordersterAnker(world, bauten, ziel) {
  let best = null;
  let bestD = Infinity;
  for (const b of bauten) {
    if (!b.done || anchorRadius(world, b) === 0) continue;
    const dd = dist2(b.x, b.y, ziel.x, ziel.y);
    if (dd < bestD) {
      bestD = dd;
      best = b;
    }
  }
  return best;
}

/**
 * Feindliche Einheit, die einem eigenen Gebaeude am naechsten gekommen ist --
 * oder die irgendwo in der eigenen Domaene steht. Eine grosse Domaene ist
 * damit auch ein grosses Gebiet, das verteidigt wird.
 */
function naechsterEindringling(world, me, bauten) {
  const nah = 3000 * 3000;
  let best = null;
  let bestD = nah;
  let drin = null;
  for (const o of world.entities) {
    if (o.dead || o.player === me || o.kind !== 'unit') continue;
    if (!drin && inDomain(world, me, o.x, o.y)) drin = o;
    for (const b of bauten) {
      const dd = dist2(o.x, o.y, b.x, b.y);
      if (dd < bestD) {
        bestD = dd;
        best = o;
      }
    }
  }
  return best || drin;
}

/** Naechster gegnerischer Foerderbau fuer Goetterblut, vom eigenen Hauptgebaeude aus. */
function gegnerFoerderung(world, me, haupt) {
  let best = null;
  let bestD = Infinity;
  for (const e of world.entities) {
    if (e.dead || e.player === me || e.kind !== 'building' || !BUILDINGS[e.type].blutOut) continue;
    const dd = dist2(e.x, e.y, haupt.x, haupt.y);
    if (dd < bestD) {
      bestD = dd;
      best = e;
    }
  }
  return best;
}

function gegnerHaupt(world, me) {
  return world.entities.find(
    (e) => e.player !== me && !e.dead && e.kind === 'building' && BUILDINGS[e.type].vital
  );
}

function naechsteVersorgte(world, bauten, zu) {
  let best = null;
  let bestD = Infinity;
  for (const b of bauten) {
    if (!b.done) continue;
    const reg = world.regions[b.region];
    if (!reg || reg.supply === 0) continue;
    const dd = dist2(b.x, b.y, zu.x, zu.y);
    if (dd < bestD) {
      bestD = dd;
      best = b;
    }
  }
  return best;
}

function freieAder(world, von, kind) {
  let best = null;
  let bestD = Infinity;
  for (const d of world.deposits) {
    if (d.kind !== kind || d.takenBy !== 0) continue;
    const dd = dist2(von.x, von.y, d.x, d.y);
    if (dd < bestD) {
      bestD = dd;
      best = d;
    }
  }
  return best;
}

const grenze = (v) => Math.max(400, Math.min(MAP - 400, v | 0));

/** Platz um das Hauptgebaeude, aber innerhalb der eigenen Domaene, solange sie klein ist. */
function daheim(world, haupt, radius, grad) {
  const r = Math.min(radius, Math.max(300, anchorRadius(world, haupt) - 150));
  return [grenze(haupt.x + (((r * cosDeg(grad)) / 1000) | 0)), grenze(haupt.y + (((r * sinDeg(grad)) / 1000) | 0))];
}

/** Richtung von a nach b in ganzen Grad, ueber eine Integer-Suche in der Tabelle. */
function winkel(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const d = isqrt(dx * dx + dy * dy);
  if (d === 0) return 0;
  let best = 0;
  let bestS = -Infinity;
  for (let g = 0; g < 360; g++) {
    const s = dx * cosDeg(g) + dy * sinDeg(g);
    if (s > bestS) {
      bestS = s;
      best = g;
    }
  }
  return best;
}


/* ---------------------------------- */

// Darstellung und Eingabe. Aendert den Simulationszustand nie direkt,
// sondern nur ueber issue(). Wird von tools/bundle.mjs mit der Sim
// zusammengefuegt -- deshalb hier keine Imports.

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');

let meFaction = 'mensch';
let world, ai, aiMe;
let angriff = false; // A gedrueckt: naechster Klick ist eine Angriffsbewegung
let stats; // Auswertung der Partie, siehe zaehle()
let zeigeAuswertung = false;
let gegnerStil = 'standard'; // Stil der Gegner-KI, im Startbildschirm waehlbar
const ME = 0;

const cam = { x: 3000, y: 3000, z: 0.038 };
let sel = [];
let drag = null;
let placing = null;
let hover = { x: 0, y: 0 };
let paused = false;
let speed = 1;
let acc = 0;
let last = performance.now();

const COL = {
  bg: '#12140f',
  grid: '#1b1f17',
  cleared: '#2a2318',
  text: '#d8dcd0',
  dim: '#7d8575',
  bad: '#c4603f',
  gold: '#d8b06a',
  blut: '#a86fb5',
};

function neu(f, zuschauen = false) {
  meFaction = f;
  const gegner = f === 'mensch' ? 'gott' : 'mensch';
  world = createWorld({ seed: (Date.now() / 1000) | 0, factions: [f, gegner] });
  ai = createAI(1, world.seed, gegnerStil);
  // Zuschauen: dieselbe KI spielt auch die eigene Seite.
  aiMe = zuschauen ? createAI(0, world.seed + 1) : null;
  angriff = false;
  zeigeAuswertung = false;
  stats = neueStats();
  sel = [];
  placing = null;
  flaeche = { tick: -1, ha: [0, 0], verlauf: [[], []] };
  cam.x = 3000;
  cam.y = 3000;
  renderBar();
}

function resize() {
  cv.width = cv.clientWidth * devicePixelRatio;
  cv.height = cv.clientHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener('resize', resize);

const w2sx = (x) => (x - cam.x) * cam.z + cv.clientWidth / 2;
const w2sy = (y) => (y - cam.y) * cam.z + cv.clientHeight / 2;
const s2wx = (x) => (x - cv.clientWidth / 2) / cam.z + cam.x;
const s2wy = (y) => (y - cv.clientHeight / 2) / cam.z + cam.y;

// ------------------------------------------------------------ Eingabe
cv.addEventListener('contextmenu', (e) => e.preventDefault());

cv.addEventListener('mousedown', (e) => {
  const mx = e.offsetX;
  const my = e.offsetY;
  if (e.button === 2) {
    placing = null;
    angriff = false;
    if (sel.length) {
      issue(world, { type: 'move', player: ME, ids: sel.slice(), x: s2wx(mx) | 0, y: s2wy(my) | 0 });
    }
    return;
  }
  if (e.button === 1) {
    drag = { pan: true, sx: mx, sy: my, cx: cam.x, cy: cam.y };
    return;
  }
  if (placing) {
    issue(world, { type: 'build', player: ME, building: placing, x: s2wx(mx) | 0, y: s2wy(my) | 0 });
    if (!e.shiftKey) placing = null;
    return;
  }
  if (angriff && sel.length) {
    issue(world, { type: 'attack', player: ME, ids: sel.slice(), x: s2wx(mx) | 0, y: s2wy(my) | 0 });
    angriff = false;
    return;
  }
  drag = { sx: mx, sy: my, x: mx, y: my, add: e.shiftKey };
});

addEventListener('mousemove', (e) => {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  hover = { x: s2wx(mx) | 0, y: s2wy(my) | 0 };
  if (!drag) return;
  if (drag.pan) {
    cam.x = drag.cx - (mx - drag.sx) / cam.z;
    cam.y = drag.cy - (my - drag.sy) / cam.z;
  } else {
    drag.x = mx;
    drag.y = my;
  }
});

addEventListener('mouseup', () => {
  if (drag && !drag.pan) {
    const x1 = Math.min(drag.sx, drag.x);
    const x2 = Math.max(drag.sx, drag.x);
    const y1 = Math.min(drag.sy, drag.y);
    const y2 = Math.max(drag.sy, drag.y);
    const box = x2 - x1 > 4 || y2 - y1 > 4;
    const picked = [];
    for (const e of world.entities) {
      if (e.player !== ME || e.kind !== 'unit') continue;
      const sx = w2sx(e.x);
      const sy = w2sy(e.y);
      if (box) {
        if (sx >= x1 && sx <= x2 && sy >= y1 && sy <= y2) picked.push(e.id);
      } else if (Math.hypot(sx - x1, sy - y1) < 16) picked.push(e.id);
    }
    if (!box && picked.length === 0) {
      for (const e of world.entities) {
        if (e.player !== ME || e.kind !== 'building') continue;
        if (Math.hypot(w2sx(e.x) - x1, w2sy(e.y) - y1) < BUILDINGS[e.type].radius * cam.z + 12) {
          sel = [e.id];
          drag = null;
          return;
        }
      }
    }
    sel = drag.add ? [...new Set([...sel, ...picked])] : picked;
  }
  drag = null;
});

cv.addEventListener(
  'wheel',
  (e) => {
    e.preventDefault();
    const wx = s2wx(e.offsetX);
    const wy = s2wy(e.offsetY);
    cam.z = Math.max(0.012, Math.min(0.2, cam.z * (e.deltaY < 0 ? 1.15 : 0.87)));
    cam.x = wx - (e.offsetX - cv.clientWidth / 2) / cam.z;
    cam.y = wy - (e.offsetY - cv.clientHeight / 2) / cam.z;
  },
  { passive: false }
);

addEventListener('keydown', (e) => {
  const liste = bauListe();
  const i = '12345'.indexOf(e.key);
  if (i >= 0 && liste[i]) placing = liste[i];
  if (e.key === 'Escape') {
    placing = null;
    angriff = false;
    sel = [];
  }
  if (e.key === 'a' && sel.some((id) => byId(world, id)?.kind === 'unit')) {
    angriff = true;
    placing = null;
  }
  if (e.key === ' ') {
    paused = !paused;
    e.preventDefault();
  }
  if (e.key === 'i') zeigeAuswertung = !zeigeAuswertung;
  if (e.key === 'k') {
    const k = kommandantVon(world, ME);
    if (k) {
      sel = [k.id];
      cam.x = k.x;
      cam.y = k.y;
    }
  }
  if (e.key === '+') speed = Math.min(8, speed * 2);
  if (e.key === '-') speed = Math.max(0.5, speed / 2);
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel.length === 1) {
    const b = byId(world, sel[0]);
    if (b && b.kind === 'building') issue(world, { type: 'demolish', player: ME, id: b.id });
  }
  if ((e.key === 'q' || e.key === 'w') && sel.length === 1) {
    const b = byId(world, sel[0]);
    if (b && b.kind === 'building' && b.done && BUILDINGS[b.type].buildList) {
      const l = BUILDINGS[b.type].buildList;
      const u = e.key === 'q' ? l[1] : l[2] || l[1];
      if (u) issue(world, { type: 'produce', player: ME, id: b.id, unit: u });
    }
  }
});

mini.addEventListener('mousedown', (e) => {
  cam.x = (e.offsetX / mini.clientWidth) * MAP;
  cam.y = (e.offsetY / mini.clientHeight) * MAP;
});

function bauListe() {
  return meFaction === 'mensch'
    ? ['schmiede', 'saege', 'turm', 'kaserne', 'schacht']
    : ['quelle', 'moos', 'hain', 'dickicht', 'blutwurz'];
}

function renderBar() {
  const bar = document.getElementById('builds');
  bar.innerHTML = bauListe()
    .map((t, i) => `<button data-b="${t}">${BUILDINGS[t].name}<kbd>${i + 1}</kbd></button>`)
    .join('');
  for (const b of bar.querySelectorAll('[data-b]')) b.onclick = () => (placing = b.dataset.b);
}

// ------------------------------------------------------------ Schleife
function frame(now) {
  const dt = Math.min(250, now - last);
  last = now;
  if (!paused && !world.over) {
    acc += dt * speed;
    let guard = 0;
    while (acc >= TICK_MS && guard++ < 12) {
      if (aiMe) stepAI(aiMe, world);
      stepAI(ai, world);
      step(world);
      zaehle();
      acc -= TICK_MS;
      sel = sel.filter((id) => byId(world, id));
    }
  }
  draw();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------ Zeichnen
function draw() {
  const W = cv.clientWidth;
  const H = cv.clientHeight;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid(W, H);
  drawCleared();
  drawDomains();
  drawDeposits();
  drawEntities();
  drawSelection();
  if (placing) drawGhost();
  drawHud();
  drawMini();
}

function drawGrid(W, H) {
  const s = 2000;
  ctx.strokeStyle = COL.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = Math.floor(s2wx(0) / s) * s; x < s2wx(W) + s; x += s) {
    const sx = Math.round(w2sx(x)) + 0.5;
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx, H);
  }
  for (let y = Math.floor(s2wy(0) / s) * s; y < s2wy(H) + s; y += s) {
    const sy = Math.round(w2sy(y)) + 0.5;
    ctx.moveTo(0, sy);
    ctx.lineTo(W, sy);
  }
  ctx.stroke();
  ctx.strokeStyle = '#2a3022';
  ctx.lineWidth = 2;
  ctx.strokeRect(w2sx(0), w2sy(0), MAP * cam.z, MAP * cam.z);
}

function drawCleared() {
  ctx.fillStyle = COL.cleared;
  for (const c of world.cleared) {
    ctx.beginPath();
    ctx.arc(w2sx(c.x), w2sy(c.y), c.r * cam.z, 0, Math.PI * 2);
    ctx.fill();
  }
}

/** Die Domäne ist die wichtigste Linie im Spiel -- also die auffälligste. */
function drawDomains() {
  for (let p = 0; p < 2; p++) {
    const col = FACTIONS[world.players[p].faction].color;
    const anker = world.entities.filter(
      (e) => !e.dead && e.player === p && e.kind === 'building' && anchorRadius(world, e) > 0
    );
    if (!anker.length) continue;

    ctx.save();
    ctx.beginPath();
    for (const e of anker) {
      ctx.moveTo(w2sx(e.x) + anchorRadius(world, e) * cam.z, w2sy(e.y));
      ctx.arc(w2sx(e.x), w2sy(e.y), anchorRadius(world, e) * cam.z, 0, Math.PI * 2);
    }
    ctx.fillStyle = col;
    ctx.globalAlpha = p === ME ? 0.1 : 0.07;
    ctx.fill();
    ctx.restore();
    // Nur die Aussenkante der Vereinigung, keine inneren Boegen: die Grenze
    // ist die wichtigste Linie im Spiel (konzept.md, offene Frage).
    grenzlinie(anker, col, p === ME ? 2 : 1.5, p === ME ? 0.8 : 0.5);
    ctx.save();

    // Vorschau: so weit reicht jeder wachsende Anker in zwei Minuten.
    const g = FACTIONS[world.players[p].faction].growth;
    if (g.perTick > 0) {
      ctx.beginPath();
      for (const e of anker) {
        const r = anchorRadius(world, e);
        if (r >= g.max) continue;
        const spaeter = Math.min(g.max, r + g.perTick * VORSCHAU_TICKS) * cam.z;
        ctx.moveTo(w2sx(e.x) + spaeter, w2sy(e.y));
        ctx.arc(w2sx(e.x), w2sy(e.y), spaeter, 0, Math.PI * 2);
      }
      ctx.globalAlpha = p === ME ? 0.3 : 0.18;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}

const VORSCHAU_TICKS = 1200; // zwei Minuten

// Aussenkante einer Kreisvereinigung: auf einer eigenen Ebene alle Kreise
// doppelt so breit umranden, dann alle Kreisflaechen wieder ausstanzen.
// Uebrig bleibt die aeussere Haelfte der Linie -- nur dort, wo kein anderer
// Kreis liegt.
const randCv = document.createElement('canvas');
const rctx = randCv.getContext('2d');
function grenzlinie(anker, farbe, breite, alpha) {
  if (randCv.width !== cv.width || randCv.height !== cv.height) {
    randCv.width = cv.width;
    randCv.height = cv.height;
  }
  rctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  rctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  const kreise = () => {
    rctx.beginPath();
    for (const e of anker) {
      const r = anchorRadius(world, e) * cam.z;
      rctx.moveTo(w2sx(e.x) + r, w2sy(e.y));
      rctx.arc(w2sx(e.x), w2sy(e.y), r, 0, Math.PI * 2);
    }
  };
  rctx.globalCompositeOperation = 'source-over';
  rctx.strokeStyle = farbe;
  rctx.lineWidth = breite * 2;
  kreise();
  rctx.stroke();
  rctx.globalCompositeOperation = 'destination-out';
  kreise();
  rctx.fill();
  rctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = alpha;
  ctx.drawImage(randCv, 0, 0);
  ctx.restore();
}

function drawDeposits() {
  for (const d of world.deposits) {
    const x = w2sx(d.x);
    const y = w2sy(d.y);
    const r = Math.max(3, (d.kind === 'goetterblut' ? 150 : 90) * cam.z);
    ctx.strokeStyle = d.kind === 'goetterblut' ? COL.blut : COL.dim;
    ctx.globalAlpha = d.takenBy ? 0.3 : 0.85;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (d.kind === 'goetterblut') {
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    } else ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawEntities() {
  for (const e of world.entities) {
    const col = FACTIONS[world.players[e.player].faction].color;
    const x = w2sx(e.x);
    const y = w2sy(e.y);
    if (x < -60 || y < -60 || x > cv.clientWidth + 60 || y > cv.clientHeight + 60) continue;

    if (e.kind === 'building') {
      const def = BUILDINGS[e.type];
      const r = Math.max(4, def.radius * cam.z);
      ctx.fillStyle = e.done ? '#1d2118' : '#171a13';
      ctx.strokeStyle = col;
      ctx.lineWidth = def.vital ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.rect(x - r, y - r, r * 2, r * 2);
      ctx.fill();
      if (!e.done) ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (e.done && e.powered < 1000) {
        ctx.fillStyle = COL.bad;
        ctx.globalAlpha = 0.2 + 0.3 * Math.sin(performance.now() / 200);
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
        ctx.globalAlpha = 1;
      }
      if (r > 10) {
        ctx.fillStyle = COL.text;
        ctx.font = '9px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(def.short, x, y + 3);
      }
      if (!e.done) {
        const f = Math.min(1, e.progress / (def.buildTime * 1000));
        ctx.fillStyle = f > 0 ? col : COL.bad;
        ctx.fillRect(x - r, y + r + 2, Math.max(1, r * 2 * f), 2);
      }
      if (e.queue && e.queue.length) {
        ctx.fillStyle = COL.gold;
        const f = Math.min(1, e.queueProgress / (UNITS[e.queue[0]].buildTime * 1000));
        ctx.fillRect(x - r, y - r - 5, r * 2 * f, 3);
      }
    } else {
      const def = UNITS[e.type];
      const r = Math.max(def.commander ? 6 : 2.5, def.radius * cam.z);
      if (def.commander) {
        // Baulinie zur Baustelle, an der er gerade erschafft
        const site = e.baut ? byId(world, e.baut) : null;
        if (site) {
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.7;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(w2sx(site.x), w2sy(site.y));
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
        ctx.strokeStyle = COL.gold;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, r + 4, 0, Math.PI * 2);
        ctx.stroke();
        if (r > 8) {
          ctx.fillStyle = COL.text;
          ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(def.name, x, y + r + 16);
        }
      }
      ctx.fillStyle = col;
      ctx.beginPath();
      if (def.commander) ctx.arc(x, y, r, 0, Math.PI * 2);
      else if (def.worker) ctx.arc(x, y, r * 0.8, 0, Math.PI * 2);
      else if (def.hp > 500) ctx.rect(x - r, y - r * 0.9, r * 2, r * 1.8);
      else {
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + r, y + r);
        ctx.lineTo(x - r, y + r);
        ctx.closePath();
      }
      ctx.fill();
      if (e.hp < e.maxHp || def.commander) {
        const bw = def.commander ? Math.max(24, r * 3) : r * 2;
        const by = y - r - (def.commander ? 10 : 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(x - bw / 2, by, bw, def.commander ? 3 : 2);
        ctx.fillStyle = e.hp * 3 < e.maxHp ? COL.bad : '#8fc46a';
        ctx.fillRect(x - bw / 2, by, (bw * e.hp) / e.maxHp, def.commander ? 3 : 2);
      }
    }
  }

  ctx.strokeStyle = '#e8c87a';
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const ev of world.events) {
    if (ev.t !== 'shot') continue;
    const a = byId(world, ev.from);
    const b = byId(world, ev.to);
    if (!a || !b) continue;
    ctx.moveTo(w2sx(a.x), w2sy(a.y));
    ctx.lineTo(w2sx(b.x), w2sy(b.y));
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawSelection() {
  if (angriff) {
    // Angriffsbewegung scharf: Fadenkreuz am Mauszeiger.
    const x = w2sx(hover.x);
    const y = w2sy(hover.y);
    ctx.strokeStyle = COL.bad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.moveTo(x - 15, y);
    ctx.lineTo(x + 15, y);
    ctx.moveTo(x, y - 15);
    ctx.lineTo(x, y + 15);
    ctx.stroke();
  }
  ctx.strokeStyle = '#f0f4e8';
  ctx.lineWidth = 1;
  for (const id of sel) {
    const e = byId(world, id);
    if (!e) continue;
    const def = e.kind === 'unit' ? UNITS[e.type] : BUILDINGS[e.type];
    ctx.beginPath();
    ctx.arc(w2sx(e.x), w2sy(e.y), Math.max(5, def.radius * cam.z) + 4, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (drag && !drag.pan) {
    ctx.strokeStyle = '#c8d8b0';
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(drag.sx, drag.sy, drag.x - drag.sx, drag.y - drag.sy);
    ctx.setLineDash([]);
  }
}

function drawGhost() {
  const def = BUILDINGS[placing];
  // Foerderbauten rasten auf die naechste Ader ein, wie in tryPlace().
  let gx = hover.x;
  let gy = hover.y;
  let ohneAder = false;
  if (def.needs) {
    const dep = findDeposit(world, hover.x, hover.y, def.needs);
    if (dep && !dep.takenBy) {
      gx = dep.x;
      gy = dep.y;
    } else ohneAder = true;
  }
  const x = w2sx(gx);
  const y = w2sy(gy);
  const r = Math.max(4, def.radius * cam.z);
  const drin = inDomain(world, ME, gx, gy);
  const gerodet = def.needsGrowth && isCleared(world, gx, gy);
  const col = gerodet || ohneAder ? COL.bad : drin ? FACTIONS[meFaction].color : COL.gold;

  if (def.anchor) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.45;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(x, y, FACTIONS[meFaction].growth.start * cam.z, 0, Math.PI * 2);
    ctx.stroke();
    if (FACTIONS[meFaction].growth.max > FACTIONS[meFaction].growth.start) {
      ctx.globalAlpha = 0.2;
      ctx.setLineDash([2, 6]);
      ctx.beginPath();
      ctx.arc(x, y, FACTIONS[meFaction].growth.max * cam.z, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.strokeRect(x - r, y - r, r * 2, r * 2);
  ctx.fillStyle = COL.text;
  ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = 'center';
  const ader = def.needs === 'goetterblut' ? 'Götterblut-Ader' : 'Fron-Ader';
  const txt = ohneAder
    ? def.name + ' — braucht eine freie ' + ader
    : gerodet
    ? def.name + ' — gerodeter Boden trägt nicht'
    : drin
      ? def.name
      : def.name + ' — außerhalb der Domäne: nur der Kommandant baut hier';
  ctx.fillText(txt, x, y - r - 8);
}

// ------------------------------------------------------------ HUD
function drawHud() {
  const p = world.players[ME];
  const regionen = gridReport(world, ME);
  let rows = '';
  for (const r of regionen) {
    const pct = r.demand === 0 ? 100 : Math.min(100, Math.round((r.supply / r.demand) * 100));
    rows += `<div class="reg ${r.throttled ? 'bad' : 'ok'}">
      <span class="rn">Domäne ${r.index + 1}</span><span class="rb">${r.supply}/${r.demand}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span class="rs">${r.throttled ? drossel(r) : 'stabil'}</span></div>`;
  }
  if (!rows) rows = '<div class="reg"><span class="rn">keine Domäne</span></div>';

  document.getElementById('hud').innerHTML = `
    <div class="fac">${FACTIONS[meFaction].name}${aiMe ? ' · Zuschauen' : ''} · Gegner ${gegnerStil}</div>
    <div class="res">
      <b>Fron</b><span>${p.fron}</span>
      <b>Götterblut</b><span>${p.goetterblut}</span>
      <b>Einheiten</b><span>${world.entities.filter((e) => e.kind === 'unit' && e.player === ME).length}</span>
      ${kommandantZeile()}
      <b>Zeit</b><span>${(world.tick / 600).toFixed(1)} min${paused ? ' ⏸' : ''} ×${speed}</span>
    </div>
    ${flaecheHtml()}
    ${auswahlHtml()}
    <div class="regs">${rows}</div>
    ${world.over ? `<div class="over">${world.winner === ME ? 'Gewonnen' : 'Verloren'}</div>` : ''}

}

function kommandantZeile() {
  const k = kommandantVon(world, ME);
  if (!k) return '';
  const pct = Math.round((100 * k.hp) / k.maxHp);
  const farbe = pct < 34 ? COL.bad : COL.text;
  const baut = k.baut ? ' · baut' : '';
  return `<b>${UNITS[k.type].name} <kbd>K</kbd></b><span style="color:${farbe}">${pct} %${baut}</span>`;
}

// ------------------------------------------------------------ Auswertung
// Die Leitfrage beim Selbstspielen: Wann fordert die Domaene eine
// Entscheidung, wann nervt sie? Reibung (gedrosselte und stillstehende
// Baustellen), Kampfort, Anker und Goetterblut -- je Seite gezaehlt.
function neueStats() {
  const seite = () => ({
    blut: -1,
    heim: 0,
    fremd: 0,
    frei: 0,
    ankerGebaut: 0,
    ankerVerloren: 0,
    gebaut: 0,
    gefallen: 0,
    gedrosselt: 0,
    still: 0,
  });
  return [seite(), seite()];
}

function zaehle() {
  for (let p = 0; p < 2; p++) {
    if (stats[p].blut < 0 && world.players[p].goetterblut > 0) stats[p].blut = world.tick;
  }
  for (const ev of world.events) {
    if (ev.t === 'shot') {
      const s = byId(world, ev.from);
      if (!s) continue;
      const z = stats[s.player];
      if (inDomain(world, s.player, s.x, s.y)) z.heim++;
      else if (inForeignDomain(world, s.player, s.x, s.y)) z.fremd++;
      else z.frei++;
    } else if (ev.t === 'built') {
      const b = byId(world, ev.id);
      if (b && BUILDINGS[b.type].anchor) stats[b.player].ankerGebaut++;
    } else if (ev.t === 'spawned') {
      const u = byId(world, ev.id);
      if (u) stats[u.player].gebaut++;
    } else if (ev.t === 'died') {
      if (ev.kind === 'unit') stats[ev.player].gefallen++;
      else if (BUILDINGS[ev.type].anchor) stats[ev.player].ankerVerloren++;
    }
  }
  // Reibung: ein Tick zaehlt, wenn irgendeine Baustelle gedrosselt ist bzw.
  // ganz ohne Gegenwart steht (meist: ausserhalb der Domaene gebaut).
  const gedrosselt = [false, false];
  const still = [false, false];
  for (const e of world.entities) {
    if (e.dead || e.kind !== 'building' || e.done) continue;
    if (e.powered === 0) still[e.player] = true;
    else if (e.powered < 1000) gedrosselt[e.player] = true;
  }
  for (let p = 0; p < 2; p++) {
    if (gedrosselt[p]) stats[p].gedrosselt++;
    if (still[p]) stats[p].still++;
  }
}

function auswertungHtml() {
  const min = (t) => (t < 0 ? '—' : (t / 600).toFixed(1).replace('.', ','));
  const sek = (t) => Math.round(t / 10) + ' s';
  const ort = (z) => {
    const n = z.heim + z.fremd + z.frei;
    if (!n) return '—';
    const pct = (x) => Math.round((100 * x) / n);
    return `${pct(z.heim)}·${pct(z.fremd)}·${pct(z.frei)}`;
  };
  const a = stats[ME];
  const b = stats[1 - ME];
  const zeile = (name, f) => `<b>${name}</b><span>${f(a)}</span><span>${f(b)}</span>`;
  return `<div class="eval">
    <div class="fac">Auswertung${world.over ? '' : ' (I)'}</div>
    <div class="evg">
      <b></b><span class="evh">du</span><span class="evh">Gegner</span>
      ${zeile('Götterblut ab', (s) => min(s.blut))}
      ${zeile('Schüsse % heim·fremd·frei', ort)}
      ${zeile('Anker +/−', (s) => s.ankerGebaut + '/' + s.ankerVerloren)}
      ${zeile('Einheiten +/−', (s) => s.gebaut + '/' + s.gefallen)}
      ${zeile('Bau gedrosselt', (s) => sek(s.gedrosselt))}
      ${zeile('Bau ohne Gegenwart', (s) => sek(s.still))}
    </div></div>`;
}

// ------------------------------------------------------------ Domänenfläche
// Die Kernfrage des Prototyps, sichtbar gemacht: Wie groß ist welche Domäne
// gerade, und wie hat sich das entwickelt? Nur Anzeige, ändert nichts.
const FLAECHE_RASTER = 200; // dm, also 20 m × 20 m = 0,04 ha je Zelle
let flaeche = { tick: -1, ha: [0, 0], verlauf: [[], []] };

function messeFlaeche() {
  if (flaeche.tick >= 0 && world.tick >= flaeche.tick && world.tick - flaeche.tick < 50) return;
  flaeche.tick = world.tick;
  const zellen = [0, 0];
  for (let y = FLAECHE_RASTER >> 1; y < MAP; y += FLAECHE_RASTER) {
    for (let x = FLAECHE_RASTER >> 1; x < MAP; x += FLAECHE_RASTER) {
      for (let p = 0; p < 2; p++) if (inDomain(world, p, x, y)) zellen[p]++;
    }
  }
  const zelleHa = (FLAECHE_RASTER * FLAECHE_RASTER) / 1e6; // dm² -> ha
  flaeche.ha = zellen.map((z) => Math.round(z * zelleHa));
  const n = Math.floor(world.tick / 300); // alle 30 s ein Punkt
  for (let p = 0; p < 2; p++) {
    flaeche.verlauf[p][n] = flaeche.ha[p];
  }
}

function flaecheHtml() {
  messeFlaeche();
  const v = flaeche.verlauf;
  const len = Math.max(v[0].length, 2);
  const top = Math.max(1, ...v[0].filter(Number.isFinite), ...v[1].filter(Number.isFinite));
  const linie = (arr) =>
    arr
      .map((h, i) => (Number.isFinite(h) ? `${((i / (len - 1)) * 240).toFixed(1)},${(36 - (h / top) * 34).toFixed(1)}` : ''))
      .filter(Boolean)
      .join(' ');
  const farbe = (p) => FACTIONS[world.players[p].faction].color;
  const gegner = 1 - ME;
  return `<div class="area">
      <div class="res">
        <b>Domäne</b><span style="color:${farbe(ME)}">${flaeche.ha[ME]} ha</span>
        <b>Gegner</b><span style="color:${farbe(gegner)}">${flaeche.ha[gegner]} ha</span>
      </div>
      <svg viewBox="0 0 240 38" preserveAspectRatio="none" class="spark">
        <polyline points="${linie(v[gegner])}" fill="none" stroke="${farbe(gegner)}" stroke-width="1.2" opacity=".6"/>
        <polyline points="${linie(v[ME])}" fill="none" stroke="${farbe(ME)}" stroke-width="1.6"/>
      </svg></div>`;
}

function auswahlHtml() {
  if (sel.length !== 1) return '';
  const e = byId(world, sel[0]);
  if (!e || e.kind !== 'building') return '';
  const def = BUILDINGS[e.type];
  const zustand = !e.done
    ? `Baustelle ${Math.min(100, Math.floor(e.progress / (def.buildTime * 10)))} %`
    : e.powered < 1000
      ? `gedrosselt ${Math.round(e.powered / 10)} %`
      : 'versorgt';
  const tasten = def.buildList
    ? def.buildList
        .slice(1)
        .map((u, i) => `<kbd>${'QW'[i]}</kbd> ${UNITS[u].name}${UNITS[u].cost.goetterblut ? ` (${UNITS[u].cost.goetterblut} Götterblut)` : ''}`)
        .join(' · ')
    : '';
  const abriss = def.vital ? '' : ' · <kbd>Entf</kbd> abreißen';
  return `<div class="sel"><b>${def.name}</b> — ${zustand}${e.queue.length ? ` · ${e.queue.length} in Auftrag` : ''}
    <div class="keys">${tasten}${abriss}</div></div>`;
}

function drossel(r) {
  for (let i = 3; i >= 0; i--) if (r.satPrio[i] < 1000) return PRIO_NAMES[i] + ' gedrosselt';
  return 'stabil';
}

function drawMini() {
  mctx.fillStyle = '#0b0d08';
  mctx.fillRect(0, 0, mini.width, mini.height);
  const s = mini.width / MAP;
  mctx.fillStyle = COL.cleared;
  for (const c of world.cleared) {
    mctx.beginPath();
    mctx.arc(c.x * s, c.y * s, c.r * s, 0, Math.PI * 2);
    mctx.fill();
  }
  for (let p = 0; p < 2; p++) {
    mctx.fillStyle = FACTIONS[world.players[p].faction].color;
    mctx.globalAlpha = 0.18;
    for (const e of world.entities) {
      if (e.player !== p || e.kind !== 'building') continue;
      const r = anchorRadius(world, e);
      if (!r) continue;
      mctx.beginPath();
      mctx.arc(e.x * s, e.y * s, r * s, 0, Math.PI * 2);
      mctx.fill();
    }
    mctx.globalAlpha = 1;
    for (const e of world.entities) {
      if (e.player !== p) continue;
      const sz = e.kind === 'building' ? 3 : 2;
      mctx.fillRect(e.x * s - sz / 2, e.y * s - sz / 2, sz, sz);
    }
  }
  mctx.strokeStyle = '#4a5442';
  mctx.strokeRect(
    (cam.x - cv.clientWidth / 2 / cam.z) * s,
    (cam.y - cv.clientHeight / 2 / cam.z) * s,
    (cv.clientWidth / cam.z) * s,
    (cv.clientHeight / cam.z) * s
  );
}

}
const STIL_NAMEN = { sturm: 'Sturm — greift früh an', standard: 'Standard', burg: 'Burg — baut aus, greift spät an' };
