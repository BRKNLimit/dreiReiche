<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonit — Karteneditor</title>
<style>
  :root {
    --bg: #12140f;
    --panel: #1a1e15;
    --line: #2c3327;
    --text: #d8dcd0;
    --dim: #7d8575;
    --bad: #c4603f;
    --ok: #8fb86a;
    --accent: #d8b06a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; }
  #cv { flex: 1; display: block; min-width: 0; cursor: crosshair; }
  #seite {
    width: 300px; flex: none; overflow-y: auto; padding: 14px;
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 12px;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  p { margin: 0; color: var(--dim); font-size: 12px; }
  .werkzeuge { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  button, .btn, input[type=text] {
    font: inherit; color: var(--text); background: #232a1d;
    border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px;
  }
  button { cursor: pointer; text-align: left; }
  button:hover { border-color: var(--accent); }
  button.an { border-color: var(--accent); background: #33301f; color: #fff; }
  button kbd { float: right; color: var(--dim); font: 10px ui-monospace, monospace; }
  .reihe { display: flex; gap: 4px; flex-wrap: wrap; }
  .reihe > * { flex: 1; text-align: center; }
  input[type=text] { width: 100%; }
  input[type=range] { width: 100%; }
  #pruefung { font-size: 12px; }
  #pruefung .ok { color: var(--ok); }
  #pruefung .bad { color: var(--bad); }
  #pruefung ul { margin: 4px 0 0; padding-left: 16px; color: var(--bad); }
  #liste button { width: 100%; margin-bottom: 3px; }
  .zahlen { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  #datei { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="seite">
    <div>
      <h1>Karteneditor</h1>
      <p>Alles, was du setzt, wird um die Kartenmitte gespiegelt — beide Seiten spielen dieselbe Karte.</p>
    </div>
    <div>
      <h2>Werkzeug</h2>
      <div class="werkzeuge" id="werkzeuge"></div>
    </div>
    <div>
      <h2>Größe <span id="groesseWert"></span></h2>
      <input type="range" id="groesse" min="200" max="3500" step="50">
      <p>Mausrad ändert die Größe. Ziehen malt. Fluss: Punkte klicken, Enter oder Rechtsklick beendet.</p>
    </div>
    <div>
      <h2>Karte</h2>
      <input type="text" id="name" maxlength="40">
      <div class="zahlen" id="zahlen"></div>
    </div>
    <div id="pruefung"></div>
    <div class="reihe">
      <button id="spielen2d">▶ Spielen (2D)</button>
      <button id="spielen3d">▶ Spielen (3D)</button>
    </div>
    <div class="reihe">
      <button id="speichern">Speichern</button>
      <button id="rueck">↶ Zurück</button>
    </div>
    <div class="reihe">
      <button id="neu">Neu</button>
      <button id="zufall">⚄ Zufall</button>
    </div>
    <div class="reihe">
      <button id="exportieren">Exportieren</button>
      <button id="importieren">Importieren</button>
      <input type="file" id="datei" accept=".json,application/json">
    </div>
    <div>
      <h2>Gespeicherte Karten</h2>
      <div id="liste"></div>
    </div>
    <p><a href="resonit.html">← zum Spiel (2D)</a> · <a href="drei-reiche-3d.html">3D</a></p>
  </div>
</div>
<script>
/*__SIM__*/
</script>
</body>
</html>
