<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die drei Reiche — Prototyp</title>
<style>
  :root {
    --bg: #12140f;
    --panel: #1a1e15;
    --line: #2c3327;
    --text: #d8dcd0;
    --dim: #7d8575;
    --me: #9ab87a;
    --bad: #c4603f;
    --ok: #8fb86a;
    --accent: #d8b06a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #cv { flex: 1; display: block; width: 100%; cursor: crosshair; }

  #hud {
    position: absolute; top: 12px; left: 12px; width: 268px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
    backdrop-filter: blur(6px);
  }
  .fac {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  #builds { display: contents; }
  .res { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-variant-numeric: tabular-nums; }
  .res b { font-weight: 500; color: var(--dim); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .res span { text-align: right; font-family: ui-monospace, monospace; }
  .regs { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 7px; }
  .reg { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 11px; }
  .rn { color: var(--dim); letter-spacing: .04em; }
  .rb { font-family: ui-monospace, monospace; color: var(--text); }
  .rs { grid-column: 1 / -1; font-size: 10px; color: var(--dim); }
  .reg.bad .rs { color: var(--bad); }
  .reg.bad .rb { color: var(--bad); }
  .bar { grid-column: 1 / -1; height: 3px; background: #232a1c; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .reg.bad .bar i { background: var(--bad); }
  .over {
    margin-top: 10px; padding: 7px; text-align: center; letter-spacing: .1em;
    text-transform: uppercase; font-size: 12px; background: #232a1c; border-radius: 3px;
  }

  .area { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .spark { display: block; width: 100%; height: 38px; margin-top: 4px; }
  .sel { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; }
  .sel b { font-weight: 600; }
  .keys { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #hud kbd { font: 10px ui-monospace, monospace; color: var(--accent); }

  #bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; gap: 6px; align-items: center;
    padding: 9px 12px; background: var(--panel); border-top: 1px solid var(--line);
  }
  button {
    font: inherit; font-size: 12px; color: var(--text);
    background: #20261a; border: 1px solid var(--line);
    padding: 6px 11px; border-radius: 3px; cursor: pointer;
  }
  button:hover { border-color: var(--me); color: #fff; }
  button kbd {
    font: 10px ui-monospace, monospace; color: var(--accent);
    margin-left: 6px; opacity: .8;
  }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .hint { color: var(--dim); font-size: 11px; margin-left: auto; }

  #mini {
    position: absolute; right: 12px; top: 12px;
    width: 170px; height: 170px;
    border: 1px solid var(--line); border-radius: 3px;
    background: #0b0d08; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <canvas id="mini" width="340" height="340"></canvas>
  <div id="bar">
    <span id="builds"></span>
    <div class="sep"></div>
    <button id="asMensch">Als Menschen</button>
    <button id="asGott">Als Gott</button>
    <button id="zuschauen" title="KI gegen KI, die eigene Seite spielt mit">Zuschauen</button>
    <span class="hint">
      Linksklick wählt · Rechtsklick bewegt · <b>A</b>+Klick greift an · Mausrad zoomt · Mittlere Taste schiebt ·
      <b>1</b>–<b>5</b> bauen · Gebäude anklicken: <b>Q</b>/<b>W</b> Einheiten, <b>Entf</b> abreißen · Leertaste pausiert · +/− Tempo
    </span>
  </div>
</div>
<script>
/*__SIM__*/
</script>
</body>
</html>
